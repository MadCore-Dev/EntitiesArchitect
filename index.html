<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MadCore RPG - Data Verification Tool</title>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Lucide Icons (as SVGs inline for standalone simplicity) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #0a0a0a;
            color: #e5e5e5;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        }

        .scroll-custom::-webkit-scrollbar {
            width: 8px;
        }

        .scroll-custom::-webkit-scrollbar-track {
            background: #171717;
        }

        .scroll-custom::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 4px;
        }

        .scroll-custom::-webkit-scrollbar-thumb:hover {
            background: #525252;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // Simple Lucide Icon Components for standalone usage
        const IconWrapper = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            });
            return <i data-lucide={ name } width={ size } height={ size } className={ className }></i>;
        };

        const Dice5 = (props) => <IconWrapper name="dice-5" { ...props } />;
        const Shield = (props) => <IconWrapper name="shield" { ...props } />;
        const Zap = (props) => <IconWrapper name="zap" { ...props } />;
        const Activity = (props) => <IconWrapper name="activity" { ...props } />;
        const Filter = (props) => <IconWrapper name="filter" { ...props } />;
        const Swords = (props) => <IconWrapper name="swords" { ...props } />;
        const RotateCcw = (props) => <IconWrapper name="rotate-ccw" { ...props } />;
        const Search = (props) => <IconWrapper name="search" { ...props } />;
        const PawPrint = (props) => <IconWrapper name="paw-print" { ...props } />;
        const User = (props) => <IconWrapper name="user" { ...props } />;
        const Anchor = (props) => <IconWrapper name="anchor" { ...props } />;


        // ==========================================
        // 1. DYNAMIC DATA LOADER
        // ==========================================

        // Empty shell — populated at runtime by fetching JSON files below
        const GAME_DATA = {
            base_stats: {},
            derived_stats: {},
            skills: {},
            prefixes: {},
            bodies: {
                appendages: { arms: {}, fins: {}, legs: {}, tails: {}, tentacles: {}, wings: {} },
                cephalon: { cranium: {}, ears: {}, eyes: {}, maw: {}, nose: {} },
                core: { chassis: {}, integument: {} }
            },
            variations: {
                appearances: { patterns: {}, pigmentation: {} },
                biomes: {},          // kept for backward compat with Generator/DataGrid
                biological_upgrades: {},
                size_indices: {}
            },
            loot: { anatomy_drops: {}, harvest_types: {}, loot_quality: {} },
            // --- New buckets (Data_Dictionary entries 1-13) ---
            definitions: {
                damage_types: {},
                skill_types: {},
                combat_tags: {},
                traversal_types: {},
                vision_types: {},
                hearing_types: {},
                scent_types: {},
                terrain_types: {}
            },
            world: {
                biomes: {},
                weather_types: {},
                temperature_bands: {}
            },
            mechanics: {
                status_effects: {}
            }
        };

        // All JSON files in GameData/
        const JSON_FILE_PATHS = [
            'GameData/Definitions/base_stats.json',
            'GameData/Definitions/derived_stats.json',
            'GameData/Definitions/operations.json',
            'GameData/Definitions/combat_tags.json',
            'GameData/Definitions/types_and_ranges/damage_types.json',
            'GameData/Definitions/types_and_ranges/hearing_types.json',
            'GameData/Definitions/types_and_ranges/scent_types.json',
            'GameData/Definitions/types_and_ranges/skill_types.json',
            'GameData/Definitions/types_and_ranges/terrain_types.json',
            'GameData/Definitions/types_and_ranges/traversal_types.json',
            'GameData/Definitions/types_and_ranges/vision_types.json',
            'GameData/Definitions/validation_rules.json',
            'GameData/Entities/Appendages/arms.json',
            'GameData/Entities/Appendages/fins.json',
            'GameData/Entities/Appendages/legs.json',
            'GameData/Entities/Appendages/tails.json',
            'GameData/Entities/Appendages/tentacles.json',
            'GameData/Entities/Appendages/wings.json',
            'GameData/Entities/Cephalon/cranium.json',
            'GameData/Entities/Cephalon/ears.json',
            'GameData/Entities/Cephalon/eyes.json',
            'GameData/Entities/Cephalon/maw.json',
            'GameData/Entities/Cephalon/nose.json',
            'GameData/Entities/Core/appearance/patterns.json',
            'GameData/Entities/Core/appearance/pigmentation.json',
            'GameData/Entities/Core/chassis.json',
            'GameData/Entities/Core/integument.json',
            'GameData/Entities/Flora/canopy.json',
            'GameData/Entities/Flora/roots.json',
            'GameData/Entities/Geological/composition.json',
            'GameData/Entities/Geological/formation.json',
            'GameData/Mechanics/anatomy_drops.json',
            'GameData/Mechanics/biological_upgrades.json',
            'GameData/Mechanics/growth_stages/size_indices.json',
            'GameData/Mechanics/growth_stages/stages.json',
            'GameData/Mechanics/harvest_types.json',
            'GameData/Mechanics/loot_quality.json',
            'GameData/Mechanics/status_effects.json',
            'GameData/World/biomes.json',
            'GameData/World/temperature_bands.json',
            'GameData/World/weather_types.json',
            'GameData/World/spawning_rules/group_scaling.json',
            'GameData/World/spawning_rules/size_limits.json',
            'GameData/consumable_categories.json',
            'GameData/prefixes.json',
            'GameData/skills.json'
        ];

        // Determines which GAME_DATA bucket a file path belongs to.
        function resolveTarget(path) {
            if (path.includes('Definitions/base_stats')) return { root: 'base_stats' };
            if (path.includes('Definitions/derived_stats')) return { root: 'derived_stats' };
            if (path.endsWith('skills.json')) return { root: 'skills' };
            if (path.endsWith('prefixes.json')) return { root: 'prefixes' };

            // Bodies - Appendages
            if (path.includes('Entities/Appendages/arms')) return { root: 'bodies', path: ['appendages', 'arms'] };
            if (path.includes('Entities/Appendages/fins')) return { root: 'bodies', path: ['appendages', 'fins'] };
            if (path.includes('Entities/Appendages/legs')) return { root: 'bodies', path: ['appendages', 'legs'] };
            if (path.includes('Entities/Appendages/tails')) return { root: 'bodies', path: ['appendages', 'tails'] };
            if (path.includes('Entities/Appendages/tentacles')) return { root: 'bodies', path: ['appendages', 'tentacles'] };
            if (path.includes('Entities/Appendages/wings')) return { root: 'bodies', path: ['appendages', 'wings'] };

            // Bodies - Cephalon
            if (path.includes('Entities/Cephalon/cranium')) return { root: 'bodies', path: ['cephalon', 'cranium'] };
            if (path.includes('Entities/Cephalon/ears')) return { root: 'bodies', path: ['cephalon', 'ears'] };
            if (path.includes('Entities/Cephalon/eyes')) return { root: 'bodies', path: ['cephalon', 'eyes'] };
            if (path.includes('Entities/Cephalon/maw')) return { root: 'bodies', path: ['cephalon', 'maw'] };
            if (path.includes('Entities/Cephalon/nose')) return { root: 'bodies', path: ['cephalon', 'nose'] };

            // Bodies - Core
            if (path.includes('Entities/Core/chassis')) return { root: 'bodies', path: ['core', 'chassis'] };
            if (path.includes('Entities/Core/integument')) return { root: 'bodies', path: ['core', 'integument'] };

            // Variations (kept for backward compat with DataGrid & Generator)
            if (path.includes('Entities/Core/appearance/patterns')) return { root: 'variations', path: ['appearances', 'patterns'] };
            if (path.includes('Entities/Core/appearance/pigmentation')) return { root: 'variations', path: ['appearances', 'pigmentation'] };
            if (path.includes('Mechanics/biological_upgrades')) return { root: 'variations', path: ['biological_upgrades'] };
            if (path.includes('Mechanics/growth_stages/size_indices')) return { root: 'variations', path: ['size_indices'] };

            // Loot
            if (path.includes('Mechanics/anatomy_drops')) return { root: 'loot', path: ['anatomy_drops'] };
            if (path.includes('Mechanics/harvest_types')) return { root: 'loot', path: ['harvest_types'] };
            if (path.includes('Mechanics/loot_quality')) return { root: 'loot', path: ['loot_quality'] };

            // Definitions — types & ranges
            if (path.includes('types_and_ranges/damage_types')) return { root: 'definitions', path: ['damage_types'] };
            if (path.includes('types_and_ranges/skill_types')) return { root: 'definitions', path: ['skill_types'] };
            if (path.includes('types_and_ranges/terrain_types')) return { root: 'definitions', path: ['terrain_types'] };
            if (path.includes('types_and_ranges/traversal_types')) return { root: 'definitions', path: ['traversal_types'] };
            if (path.includes('types_and_ranges/vision_types')) return { root: 'definitions', path: ['vision_types'] };
            if (path.includes('types_and_ranges/hearing_types')) return { root: 'definitions', path: ['hearing_types'] };
            if (path.includes('types_and_ranges/scent_types')) return { root: 'definitions', path: ['scent_types'] };
            if (path.includes('Definitions/combat_tags')) return { root: 'definitions', path: ['combat_tags'] };

            // World
            if (path.includes('World/biomes')) {
                // Load into BOTH variations.biomes (Generator compat) AND world.biomes
                return { root: 'world', path: ['biomes'], also: { root: 'variations', path: ['biomes'] } };
            }
            if (path.includes('World/weather_types')) return { root: 'world', path: ['weather_types'] };
            if (path.includes('World/temperature_bands')) return { root: 'world', path: ['temperature_bands'] };

            // Mechanics
            if (path.includes('Mechanics/status_effects')) return { root: 'mechanics', path: ['status_effects'] };

            return null;
        }

        // Fetches all JSON files in parallel and populates GAME_DATA.
        async function initGameData() {
            const results = await Promise.allSettled(
                JSON_FILE_PATHS.map(path =>
                    fetch(path)
                        .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}: ${path}`); return r.json(); })
                        .then(data => ({ path, data }))
                )
            );

            const applyMapping = (mapping, data) => {
                let targetObj = GAME_DATA[mapping.root];
                if (mapping.path) {
                    for (const key of mapping.path) {
                        targetObj = targetObj[key];
                    }
                }
                Object.assign(targetObj, data);
            };

            results.forEach(result => {
                if (result.status === 'rejected') {
                    console.warn('[GameData Loader] Failed to load:', result.reason);
                    return;
                }
                const { path, data } = result.value;
                const mapping = resolveTarget(path);
                if (!mapping) return;

                applyMapping(mapping, data);
                // Some files (biomes) need to land in two buckets
                if (mapping.also) applyMapping(mapping.also, data);
            });

            console.log('[GameData Loader] Loaded successfully.', {
                base_stats: Object.keys(GAME_DATA.base_stats).length,
                bodies_core: Object.keys(GAME_DATA.bodies.core.chassis).length,
                biomes: Object.keys(GAME_DATA.world.biomes).length,
                damage_types: Object.keys(GAME_DATA.definitions.damage_types).length,
                terrain_types: Object.keys(GAME_DATA.definitions.terrain_types).length,
                status_effects: Object.keys(GAME_DATA.mechanics.status_effects).length
            });
        }

        // ==========================================
        // 2. JS ENGINE LOGIC (Porting C# Classes)
        // ==========================================

        class Stat {
            constructor(definition) {
                this.def = definition;
                this.baseValue = definition.baseValue;
                this.modifiers = [];
            }

            getCurrentValue() {
                let val = this.baseValue;
                // 1. Flat
                this.modifiers.filter(m => m.op === 'add' || m.op === 'subtract').forEach(m => {
                    val += (m.op === 'add' ? m.val : -m.val);
                });
                // 2. Percent
                let mult = 1.0;
                this.modifiers.filter(m => m.op === 'multiply').forEach(m => {
                    mult *= m.val;
                });
                val *= mult;
                // 3. Override
                const override = this.modifiers.find(m => m.op === 'set');
                if (override) val = override.val;

                return Math.max(0, val);
            }

            addMod(mod) { this.modifiers.push(mod); }
            clearMods() { this.modifiers = []; }
        }

        class PotentialStat extends Stat {
            // definition may come from old schema ({ calculationFormula }) or new ({ formula })
            constructor(definition, formula, allStats) {
                super(definition);
                this.formula = formula || definition.formula || definition.calculationFormula || '';
                this.allStats = allStats;
                this.currentValue = 0;
                this.maxValue = 0;
            }

            recalculateMax() {
                let expression = this.formula;
                Object.keys(this.allStats).forEach(key => {
                    if (this.allStats[key] instanceof Stat) {
                        const val = this.allStats[key].getCurrentValue();
                        const regex = new RegExp(`\\b${key}\\b`, 'g');
                        expression = expression.replace(regex, val);
                    }
                });

                try {
                    this.maxValue = new Function('return ' + expression)();
                } catch (e) {
                    console.error("Formula error", this.formula, e);
                    this.maxValue = 1;
                }

                this.maxValue = Math.floor(this.maxValue);
                if (this.currentValue > this.maxValue) this.currentValue = this.maxValue;
            }

            fill() {
                this.recalculateMax();
                this.currentValue = this.maxValue;
            }
        }

        class Entity {
            constructor(name) {
                this.name = name;
                this.stats = {};
                this.skills = [];
                this.traits = [];
                this.parts = [];
                this.log = [];

                this.initStats();
            }

            initStats() {
                // base_stats: entries have an `id` property
                Object.values(GAME_DATA.base_stats).forEach(def => {
                    this.stats[def.id] = new Stat(def);
                });
                // derived_stats: key IS the stat id; entries use `formula` and `description`
                Object.entries(GAME_DATA.derived_stats).forEach(([id, def]) => {
                    const fullDef = {
                        id,
                        displayName: def.displayName || def.description || id,
                        statType: 'Potential',
                        baseValue: 0,
                        ...def
                    };
                    const formula = def.formula || def.calculationFormula || '';
                    this.stats[id] = new PotentialStat(fullDef, formula, this.stats);
                });
                this.updateDerived();
            }

            updateDerived() {
                Object.values(this.stats).forEach(s => {
                    if (s instanceof PotentialStat) s.recalculateMax();
                });
            }

            applyMod(statId, op, val, source) {
                if (this.stats[statId]) {
                    this.stats[statId].addMod({ op, val, source });
                    this.updateDerived();
                }
            }

            roll(diceStr) {
                if (!diceStr) return 0;
                if (!isNaN(diceStr)) return parseFloat(diceStr);
                const [count, sides] = diceStr.split('d').map(Number);
                let total = 0;
                for (let i = 0; i < count; i++) total += Math.floor(Math.random() * sides) + 1;
                return total;
            }
        }

        // ==========================================
        // 3. REACT COMPONENTS
        // ==========================================

        const GeneratorView = () => {
            const [entity, setEntity] = useState(null);

            const generate = () => {
                const e = new Entity("Random Creature");

                // Helper to pick random item
                const pick = (obj) => {
                    if (!obj) return null;
                    const keys = Object.keys(obj);
                    if (!keys.length) return null;
                    const key = keys[Math.floor(Math.random() * keys.length)];
                    return { key, ...obj[key] };
                };

                // Helper filter pick
                const pickFiltered = (obj, pred) => {
                    if (!obj) return null;
                    const keys = Object.keys(obj).filter(k => pred(obj[k]));
                    if (!keys.length) return null;
                    const key = keys[Math.floor(Math.random() * keys.length)];
                    return { key, ...obj[key] };
                };

                // 1. Core Body - Chassis
                const chassis = pick(GAME_DATA.bodies.core.chassis);
                if (chassis) {
                    e.traits.push(chassis.key);
                    e.traits.push(...(chassis.tags || []));
                    if (chassis.skills) e.skills.push(...chassis.skills);
                    if (chassis.mods) chassis.mods.forEach(m => e.applyMod(m.target, m.op, m.val, chassis.key));
                }

                // 2. Head (Cranium)
                // In new structure, Head is primarily Cranium + potentially Maw/Eyes/Ears/Nose
                // We'll pick a Cranium if chassis has "Head" slot
                if (chassis && chassis.slots && chassis.slots.includes("Head")) {
                    const cranium = pickFiltered(GAME_DATA.bodies.cephalon.cranium, (item) => {
                        // Match tags if possible, else random
                        return !item.tags || item.tags.some(t => e.traits.includes(t));
                    }) || pick(GAME_DATA.bodies.cephalon.cranium);

                    if (cranium) {
                        e.parts.push(cranium.key);
                        if (cranium.mods) cranium.mods.forEach(m => e.applyMod(m.target, m.op, m.val, cranium.key));
                        if (cranium.skills) e.skills.push(...cranium.skills);
                    }
                }

                // 3. Integument
                const integument = pickFiltered(GAME_DATA.bodies.core.integument, (item) => {
                    return item.tags && item.tags.some(t => e.traits.includes(t));
                });
                if (integument) {
                    e.parts.push(integument.key);
                    if (integument.mods) integument.mods.forEach(m => e.applyMod(m.target, m.op, m.val, integument.key));
                }

                // 4. Variations
                e.variations = {};

                const biome = pick(GAME_DATA.variations.biomes);
                if (biome) e.variations.biome = biome.key;

                const pattern = pick(GAME_DATA.variations.appearances.patterns);
                if (pattern) e.variations.pattern = pattern.key;

                const pig = pick(GAME_DATA.variations.appearances.pigmentation);
                if (pig) e.variations.pigmentation = pig.key;

                const size = pick(GAME_DATA.variations.size_indices);
                if (size) e.variations.size = size.key;

                const bioUpgrade = Math.random() > 0.7 ? pick(GAME_DATA.variations.biological_upgrades) : null;
                if (bioUpgrade) {
                    e.variations.upgrade = bioUpgrade.key;
                    if (bioUpgrade.mods) bioUpgrade.mods.forEach(m => e.applyMod(m.target, m.op, m.val, bioUpgrade.key));
                }

                // 5. Loot
                e.loot = [];
                // Check anatomy drops against all traits/parts
                const anatomyDrops = GAME_DATA.loot.anatomy_drops || {};
                const allTags = new Set([...e.traits, ...e.parts]);

                // Matches if key matches a tag or part name fuzzy
                Object.keys(anatomyDrops).forEach(key => {
                    // Primitive matching logic as fallback
                    if (allTags.has(key) || Array.from(allTags).some(t => t.includes(key) || key.includes(t))) {
                        e.loot.push({ name: key, ...anatomyDrops[key] });
                    }
                });
                // Force at least one drop if none
                if (e.loot.length === 0 && chassis) {
                    // Fallback to generic Meat/Bones logic if nothing matched
                    if (anatomyDrops["Meat_Muscle"]) e.loot.push({ name: "Meat_Muscle", ...anatomyDrops["Meat_Muscle"] });
                    if (anatomyDrops["Legs_Bones"]) e.loot.push({ name: "Legs_Bones", ...anatomyDrops["Legs_Bones"] });
                }

                // Prefix
                if (Math.random() > 0.5) {
                    const prefix = pick(GAME_DATA.prefixes);
                    if (prefix) {
                        e.traits.push(prefix.key);
                        if (prefix.mods) prefix.mods.forEach(m => e.applyMod(m.target, m.op, m.val, prefix.key));
                    }
                }

                Object.values(e.stats).forEach(s => {
                    if (s instanceof PotentialStat) s.fill();
                });

                setEntity(e);
            };

            return (
                <div className="p-3 sm:p-4 h-full flex flex-col">
                    <button onClick={ generate } className="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg mb-3 sm:mb-4 shadow-lg transition flex items-center justify-center gap-2">
                        <Dice5 size={ 24 } />
                        Generate New Entity
                    </button>

                    { entity && (
                        <div className="flex-1 bg-neutral-800 rounded-lg p-3 sm:p-6 shadow-xl overflow-y-auto scroll-custom border border-neutral-700">
                            <div className="flex flex-wrap justify-between items-start border-b border-neutral-600 pb-3 mb-3 sm:pb-4 sm:mb-4 gap-2">
                                <div>
                                    <h2 className="text-xl sm:text-3xl font-bold text-yellow-500 flex items-center gap-2">
                                        <PawPrint className="text-yellow-600" size={ 28 } />
                                        { entity.traits.find(t => GAME_DATA.prefixes[t]) || "" } { entity.traits[0] }
                                    </h2>
                                    <div className="flex gap-2 mt-2 flex-wrap">
                                        { entity.traits.slice(1).map((t, i) => <span key={ i } className="bg-neutral-700 px-2 py-1 rounded text-xs text-gray-300 border border-neutral-600">{ t }</span>) }
                                    </div>
                                </div>
                                <div className="text-right">
                                    <div className="text-2xl sm:text-4xl font-bold text-red-500 flex items-center justify-end gap-2">
                                        <Activity size={ 24 } className="text-red-700" />
                                        { Math.floor((entity.stats.hp_max || entity.stats.hp || { currentValue: 0 }).currentValue) }
                                        <span className="text-base text-gray-500">HP</span>
                                    </div>
                                    <div className="text-sm text-gray-400">Max: { Math.floor((entity.stats.hp_max || entity.stats.hp || { maxValue: 0 }).maxValue) }</div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-6">
                                <div className="space-y-4">
                                    <div className="bg-neutral-900 p-4 rounded-lg border border-neutral-700">
                                        <h3 className="text-lg font-bold text-blue-400 mb-2 border-b border-neutral-700 pb-1 flex items-center gap-2">
                                            <User size={ 18 } /> Attributes
                                        </h3>
                                        <div className="grid grid-cols-2 gap-2">
                                            { Object.values(entity.stats).filter(s => s.def.statType === "Raw").map(s => (
                                                <div key={ s.def.id } className="flex justify-between items-center p-2 hover:bg-neutral-800 rounded transition-colors">
                                                    <span className="text-gray-400 font-medium">{ s.def.displayName }</span>
                                                    <span className="font-mono font-bold text-white bg-neutral-800 px-2 rounded">{ Math.floor(s.getCurrentValue()) }</span>
                                                </div>
                                            )) }
                                        </div>
                                    </div>

                                    {/* Loot & Harvest Block */ }
                                    <div className="bg-neutral-900 p-4 rounded-lg border border-neutral-700">
                                        <h3 className="text-lg font-bold text-yellow-600 mb-2 border-b border-neutral-700 pb-1 flex items-center gap-2">
                                            <Anchor size={ 18 } /> Loot & Harvest
                                        </h3>
                                        <div className="space-y-2">
                                            { entity.loot && entity.loot.length > 0 ? entity.loot.map((l, i) => (
                                                <div key={ i } className="flex flex-col text-sm">
                                                    <span className="text-gray-200 font-bold">{ l.name.replace(/_/g, ' ') }</span>
                                                    <span className="text-gray-500 text-xs">Drops: { l.baseDrops ? l.baseDrops.join(", ") : "Nothing" }</span>
                                                </div>
                                            )) : <span className="text-gray-500 italic">No significant loot.</span> }
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <div className="bg-neutral-900 p-4 rounded-lg border border-neutral-700">
                                        <h3 className="text-lg font-bold text-green-400 mb-2 border-b border-neutral-700 pb-1 flex items-center gap-2">
                                            <Shield size={ 18 } /> Derived Status
                                        </h3>
                                        { Object.values(entity.stats).filter(s => s instanceof PotentialStat && s.def.id !== "hp").map(s => (
                                            <div key={ s.def.id } className="flex justify-between p-1">
                                                <span className="text-gray-300">{ s.def.displayName }</span>
                                                <span className="font-mono text-yellow-400">{ Math.floor(s.maxValue) }</span>
                                            </div>
                                        )) }
                                    </div>

                                    <div className="bg-neutral-900 p-4 rounded-lg border border-neutral-700">
                                        <h3 className="text-lg font-bold text-purple-400 mb-2 border-b border-neutral-700 pb-1 flex items-center gap-2">
                                            <Anchor size={ 18 } /> Anatomy & Skills
                                        </h3>
                                        <div className="mb-3">
                                            <span className="text-xs text-gray-500 uppercase font-bold tracking-wider">Parts</span>
                                            <div className="flex flex-wrap gap-1 mt-1">
                                                { entity.parts.map((p, i) => <span key={ i } className="bg-purple-900/40 border border-purple-700 text-purple-200 px-2 py-1 rounded text-sm">{ p }</span>) }
                                            </div>
                                        </div>
                                        <div>
                                            <span className="text-xs text-gray-500 uppercase font-bold tracking-wider">Abilities</span>
                                            <div className="flex flex-wrap gap-1 mt-1">
                                                { entity.skills.map((s, i) => <span key={ i } className="bg-blue-900/40 border border-blue-700 text-blue-200 px-2 py-1 rounded text-sm">{ s }</span>) }
                                            </div>
                                        </div>
                                    </div>

                                    {/* Variations & Ecosystem Block */ }
                                    <div className="bg-neutral-900 p-4 rounded-lg border border-neutral-700">
                                        <h3 className="text-lg font-bold text-teal-400 mb-2 border-b border-neutral-700 pb-1 flex items-center gap-2">
                                            <Search size={ 18 } /> Variations & Ecosystem
                                        </h3>
                                        <div className="grid grid-cols-1 gap-2 text-sm">
                                            { entity.variations.biome && <div className="flex justify-between"><span className="text-gray-400">Biome</span><span className="text-white">{ entity.variations.biome }</span></div> }
                                            { entity.variations.pattern && <div className="flex justify-between"><span className="text-gray-400">Pattern</span><span className="text-white">{ entity.variations.pattern }</span></div> }
                                            { entity.variations.pigmentation && <div className="flex justify-between"><span className="text-gray-400">Pigment</span><span className="text-white">{ entity.variations.pigmentation }</span></div> }
                                            { entity.variations.size && <div className="flex justify-between"><span className="text-gray-400">Size</span><span className="text-white">{ entity.variations.size }</span></div> }
                                            { entity.variations.upgrade && <div className="flex justify-between"><span className="text-gray-400">Upgrade</span><span className="text-purple-300">{ entity.variations.upgrade }</span></div> }
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) }
                </div>
            );
        };

        const DataGridView = () => {
            const [filterTag, setFilterTag] = useState("");
            const [copyLabel, setCopyLabel] = useState("Copy All Tags");

            const sections = useMemo(() => [
                {
                    title: "1. Main Body",
                    groups: [
                        { name: "Core", paths: { chassis: "bodies.core.chassis", integument: "bodies.core.integument" } },
                        { name: "Cephalon", paths: { cranium: "bodies.cephalon.cranium", ears: "bodies.cephalon.ears", eyes: "bodies.cephalon.eyes", maw: "bodies.cephalon.maw", nose: "bodies.cephalon.nose" } },
                        { name: "Appendages", paths: { arms: "bodies.appendages.arms", fins: "bodies.appendages.fins", legs: "bodies.appendages.legs", tails: "bodies.appendages.tails", tentacles: "bodies.appendages.tentacles", wings: "bodies.appendages.wings" } }
                    ]
                },
                {
                    title: "2. Variations",
                    groups: [
                        { name: "Appearances", paths: { patterns: "variations.appearances.patterns", pigmentation: "variations.appearances.pigmentation" } },
                        { name: "Environment & Upgrades", paths: { biomes: "variations.biomes", "bio upgrades": "variations.biological_upgrades", sizes: "variations.size_indices" } }
                    ]
                }
            ], []);

            // Flatten paths for state
            const allPaths = useMemo(() => {
                const paths = {};
                sections.forEach(sec => {
                    sec.groups.forEach(group => {
                        Object.entries(group.paths).forEach(([label, path]) => {
                            paths[path] = true;
                        });
                    });
                });
                return paths;
            }, [sections]);

            const [toggles, setToggles] = useState(allPaths);

            const getCount = (path, useFilter = true) => {
                let target = GAME_DATA;
                path.split('.').forEach(k => {
                    if (target) target = target[k];
                });
                if (!target) return 0;

                const keys = Object.keys(target);
                if (!useFilter || !filterTag) return keys.length;

                return Object.values(target).filter(item =>
                    item.tags && item.tags.some(t => t.toLowerCase() === filterTag.toLowerCase())
                ).length;
            };

            const togglePath = (path) => setToggles(prev => ({ ...prev, [path]: !prev[path] }));

            // Calculate Totals
            const totalUniqueBodies = useMemo(() => {
                let total = 1;
                let hasActive = false;

                // Assuming multiplicative combinations across categories if active
                sections[0].groups.forEach(group => {
                    Object.entries(group.paths).forEach(([label, path]) => {
                        if (toggles[path]) {
                            const c = getCount(path);
                            // Only multiply if count > 0 to avoid zeroing out unless truly 0 options
                            if (c > 0) {
                                total *= c;
                                hasActive = true;
                            }
                        }
                    });
                });
                return hasActive ? total : 0;
            }, [toggles, filterTag, sections]);

            const totalVariations = useMemo(() => {
                let total = totalUniqueBodies;
                if (total === 0) return 0;

                sections[1].groups.forEach(group => {
                    Object.entries(group.paths).forEach(([label, path]) => {
                        if (toggles[path]) {
                            const c = getCount(path);
                            if (c > 0) total *= c;
                        }
                    });
                });
                return total;
            }, [totalUniqueBodies, toggles, filterTag, sections]);

            // Collect all tags for filter
            const allTags = useMemo(() => {
                const tags = new Set();
                const traverse = (obj) => {
                    if (!obj) return;
                    if (obj.tags && Array.isArray(obj.tags)) obj.tags.forEach(t => tags.add(t));
                    else if (typeof obj === 'object') Object.values(obj).forEach(traverse);
                };
                traverse(GAME_DATA.bodies);
                traverse(GAME_DATA.variations);
                return Array.from(tags).sort();
            }, []);

            const copyAllTags = () => {
                const tagString = allTags.join('\n');

                // Try modern Clipboard API first
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(tagString)
                        .then(() => {
                            setCopyLabel("Copied!");
                            setTimeout(() => setCopyLabel("Copy All Tags"), 2000);
                        })
                        .catch(err => {
                            console.error("Clipboard API failed:", err);
                            fallbackCopy(tagString);
                        });
                } else {
                    fallbackCopy(tagString);
                }
            };

            const fallbackCopy = (text) => {
                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;

                    // Ensure it's not visible but part of DOM
                    textArea.style.position = "fixed";
                    textArea.style.left = "-9999px";
                    textArea.style.top = "0";
                    document.body.appendChild(textArea);

                    textArea.focus();
                    textArea.select();

                    const successful = document.execCommand('copy');
                    document.body.removeChild(textArea);

                    if (successful) {
                        setCopyLabel("Copied!");
                        setTimeout(() => setCopyLabel("Copy All Tags"), 2000);
                    } else {
                        setCopyLabel("Error!");
                        setTimeout(() => setCopyLabel("Copy All Tags"), 2000);
                    }
                } catch (err) {
                    console.error("Fallback copy failed:", err);
                    setCopyLabel("Error!");
                    setTimeout(() => setCopyLabel("Copy All Tags"), 2000);
                }
            };

            return (
                <div className="p-3 sm:p-6 h-full flex flex-col">
                    {/* Header with Totals */ }
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                        <div className="bg-neutral-800 p-4 rounded-lg border border-neutral-700 shadow flex justify-between items-center">
                            <div>
                                <div className="text-xs text-gray-400 uppercase tracking-widest font-bold">Total Unique Bodies</div>
                                <div className="text-3xl font-mono text-yellow-400 font-bold">{ totalUniqueBodies.toLocaleString() }</div>
                            </div>
                            <User size={ 32 } className="text-neutral-600" />
                        </div>
                        <div className="bg-neutral-800 p-4 rounded-lg border border-neutral-700 shadow flex justify-between items-center">
                            <div>
                                <div className="text-xs text-gray-400 uppercase tracking-widest font-bold">Total Variations</div>
                                <div className="text-3xl font-mono text-green-400 font-bold">{ totalVariations.toLocaleString() }</div>
                            </div>
                            <Dice5 size={ 32 } className="text-neutral-600" />
                        </div>
                    </div>

                    {/* Filter Bar */ }
                    <div className="flex items-center gap-4 mb-4 bg-neutral-900 p-3 rounded-lg border border-neutral-800">
                        <Filter size={ 18 } className="text-gray-500" />
                        <select
                            value={ filterTag }
                            onChange={ (e) => setFilterTag(e.target.value) }
                            className="bg-black text-white px-3 py-1 rounded border border-neutral-700 focus:outline-none focus:border-blue-500"
                        >
                            <option value="">All Tags</option>
                            { allTags.map(t => <option key={ t } value={ t }>{ t }</option>) }
                        </select>
                        <button
                            onClick={ copyAllTags }
                            className="ml-2 bg-neutral-700 hover:bg-neutral-600 text-white px-3 py-2 rounded-lg text-sm font-bold border border-neutral-600 transition whitespace-nowrap"
                        >
                            { copyLabel }
                        </button>
                    </div>

                    {/* Grids */ }
                    <div className="flex-1 overflow-y-auto scroll-custom space-y-8 pr-2">
                        { sections.map(section => (
                            <div key={ section.title }>
                                <h2 className="text-xl font-bold text-white mb-4 border-b border-neutral-700 pb-2">{ section.title }</h2>
                                { section.groups.map(group => (
                                    <div key={ group.name } className="mb-6">
                                        <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2 pl-1">{ group.name }</h3>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                                            { Object.entries(group.paths).map(([label, path]) => {
                                                const isActive = toggles[path];
                                                const count = getCount(path);
                                                return (
                                                    <div key={ path }
                                                        onClick={ () => togglePath(path) }
                                                        className={ `cursor-pointer p-3 rounded-lg border transition-all ${isActive ? 'bg-neutral-800 border-neutral-600 hover:bg-neutral-700' : 'bg-neutral-900 border-neutral-800 opacity-50 hover:opacity-75'}` }
                                                    >
                                                        <div className="text-xs text-gray-400 capitalize mb-1">{ label }</div>
                                                        <div className="text-2xl font-bold text-blue-400">{ count }</div>
                                                    </div>
                                                );
                                            }) }
                                        </div>
                                    </div>
                                )) }
                            </div>
                        )) }
                    </div>
                </div>
            );
        };

        // ==========================================
        // DEFINITIONS VIEW
        // ==========================================

        // Helper: render a small tag pill
        const Pill = ({ text, color = 'neutral' }) => {
            const colorMap = {
                neutral: 'bg-neutral-700 border-neutral-600 text-neutral-200',
                blue: 'bg-blue-900/50 border-blue-700 text-blue-200',
                green: 'bg-green-900/50 border-green-700 text-green-200',
                red: 'bg-red-900/50 border-red-700 text-red-200',
                purple: 'bg-purple-900/50 border-purple-700 text-purple-200',
                yellow: 'bg-yellow-900/50 border-yellow-700 text-yellow-200',
                teal: 'bg-teal-900/50 border-teal-700 text-teal-200',
                orange: 'bg-orange-900/50 border-orange-700 text-orange-200',
                pink: 'bg-pink-900/50 border-pink-700 text-pink-200',
                sky: 'bg-sky-900/50 border-sky-700 text-sky-200',
            };
            const cls = colorMap[color] || colorMap.neutral;
            return <span className={ `inline-block text-xs px-2 py-0.5 rounded border ${cls} mr-1 mb-1` }>{ text }</span>;
        };

        // Terrain category color
        const terrainCatColor = (cat) => ({ surface: 'blue', topography: 'teal', cover: 'green', condition: 'orange', liquid: 'blue', lighting: 'yellow' }[cat] || 'neutral');

        // A card that shows a single definition entry
        const DefCard = ({ title, children }) => (
            <div className="bg-neutral-800 border border-neutral-700 rounded-lg p-3 text-sm space-y-2 hover:border-neutral-500 transition-colors">
                <div className="font-bold text-white text-base">{ title.replace(/_/g, ' ') }</div>
                { children }
            </div>
        );

        const DefinitionsView = () => {
            const DEF_SECTIONS = [
                { key: 'damage_types', label: 'Damage Types', source: () => GAME_DATA.definitions.damage_types, color: 'text-red-400' },
                { key: 'skill_types', label: 'Skill Types', source: () => GAME_DATA.definitions.skill_types, color: 'text-blue-400' },
                { key: 'combat_tags', label: 'Combat Tags', source: () => GAME_DATA.definitions.combat_tags, color: 'text-yellow-400' },
                { key: 'traversal_types', label: 'Traversal Types', source: () => GAME_DATA.definitions.traversal_types, color: 'text-teal-400' },
                { key: 'vision_types', label: 'Vision Types', source: () => GAME_DATA.definitions.vision_types, color: 'text-cyan-400' },
                { key: 'hearing_types', label: 'Hearing Types', source: () => GAME_DATA.definitions.hearing_types, color: 'text-indigo-400' },
                { key: 'scent_types', label: 'Scent Types', source: () => GAME_DATA.definitions.scent_types, color: 'text-emerald-400' },
                { key: 'terrain_types', label: 'Terrain Types', source: () => GAME_DATA.definitions.terrain_types, color: 'text-lime-400' },
                { key: 'biomes', label: 'Biomes', source: () => GAME_DATA.world.biomes, color: 'text-green-400' },
                { key: 'weather_types', label: 'Weather Types', source: () => GAME_DATA.world.weather_types, color: 'text-sky-400' },
                { key: 'temperature_bands', label: 'Temperature Bands', source: () => GAME_DATA.world.temperature_bands, color: 'text-orange-400' },
                { key: 'status_effects', label: 'Status Effects', source: () => GAME_DATA.mechanics.status_effects, color: 'text-purple-400' },
            ];

            const [activeSection, setActiveSection] = useState(DEF_SECTIONS[0].key);
            const [search, setSearch] = useState('');

            const currentSection = DEF_SECTIONS.find(s => s.key === activeSection);
            const rawData = currentSection ? currentSection.source() : {};

            const filteredEntries = useMemo(() => {
                const q = search.toLowerCase();
                return Object.entries(rawData).filter(([key, val]) => {
                    if (!q) return true;
                    const desc = (val.description || val.name || '').toLowerCase();
                    return key.toLowerCase().includes(q) || desc.includes(q);
                });
            }, [rawData, search, activeSection]);

            // ---- Renderers per section type ----
            const renderEntry = (key, val) => {
                switch (activeSection) {
                    case 'damage_types':
                        return (
                            <DefCard key={ key } title={ key }>
                                <p className="text-gray-400 text-xs leading-relaxed">{ val.description }</p>
                                { val.color && <div className="flex items-center gap-2"><div className={ `w-3 h-3 rounded-full ${val.color.replace('text-', 'bg-')}` } /><span className="text-xs text-gray-500">Combat Color</span></div> }
                                { val.payloads && val.payloads.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Triggers</div>
                                        { val.payloads.map((p, i) => (
                                            <div key={ i } className="flex justify-between text-xs">
                                                <Pill text={ p.id } color="red" />
                                                <span className="text-gray-500">{ (p.chance_per_tick * 100).toFixed(0) }%</span>
                                            </div>
                                        )) }
                                    </div>
                                ) }
                            </DefCard>
                        );

                    case 'skill_types':
                        return (
                            <DefCard key={ key } title={ key }>
                                <p className="text-gray-400 text-xs leading-relaxed">{ val.description }</p>
                                { val.combat_flags && val.combat_flags.length > 0 && (
                                    <div className="flex flex-wrap">
                                        { val.combat_flags.map(f => <Pill key={ f } text={ f } color="yellow" />) }
                                    </div>
                                ) }
                            </DefCard>
                        );

                    case 'combat_tags':
                        return (
                            <DefCard key={ key } title={ key }>
                                <div className="text-yellow-400 text-xs font-semibold mb-1">{ val.name }</div>
                                <p className="text-gray-400 text-xs leading-relaxed">{ val.description }</p>
                            </DefCard>
                        );

                    case 'traversal_types':
                    case 'vision_types':
                    case 'hearing_types':
                    case 'scent_types':
                        return (
                            <DefCard key={ key } title={ key }>
                                <p className="text-gray-400 text-xs leading-relaxed">{ val.description }</p>
                                { val.mods && val.mods.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Mods</div>
                                        { val.mods.map((m, i) => <div key={ i } className="text-xs text-green-300 font-mono">{ m.target } { m.op } { m.expr }</div>) }
                                    </div>
                                ) }
                                { val.payload_immunities && val.payload_immunities.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Immunities</div>
                                        <div className="flex flex-wrap">{ val.payload_immunities.map(p => <Pill key={ p } text={ p } color="teal" />) }</div>
                                    </div>
                                ) }
                                { val.grants_skills && val.grants_skills.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Grants Skills</div>
                                        <div className="flex flex-wrap">{ val.grants_skills.map(s => <Pill key={ s } text={ s } color="blue" />) }</div>
                                    </div>
                                ) }
                            </DefCard>
                        );

                    case 'terrain_types': {
                        const catColor = terrainCatColor(val.category);
                        return (
                            <DefCard key={ key } title={ key }>
                                <Pill text={ val.category || '?' } color={ catColor } />
                                <p className="text-gray-400 text-xs leading-relaxed">{ val.description }</p>
                                { val.required_traversal && <div className="text-xs"><span className="text-gray-500">Requires: </span><Pill text={ val.required_traversal } color="orange" /></div> }
                                { val.excludes && val.excludes.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Excludes</div>
                                        <div className="flex flex-wrap">{ val.excludes.slice(0, 5).map(e => <Pill key={ e } text={ e } color="red" />) }{ val.excludes.length > 5 && <Pill text={ `+${val.excludes.length - 5} more` } color="neutral" /> }</div>
                                    </div>
                                ) }
                                { val.payloads && val.payloads.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Payloads</div>
                                        { val.payloads.map((p, i) => (
                                            <div key={ i } className="flex justify-between text-xs">
                                                <Pill text={ p.id } color="orange" />
                                                <span className="text-gray-500">{ (p.chance_per_tick * 100).toFixed(0) }%</span>
                                            </div>
                                        )) }
                                    </div>
                                ) }
                            </DefCard>
                        );
                    }

                    case 'biomes':
                        return (
                            <DefCard key={ key } title={ val.name || key }>
                                <p className="text-gray-400 text-xs leading-relaxed">{ val.description }</p>
                                { val.climate && (
                                    <div className="text-xs flex gap-2 flex-wrap">
                                        { val.climate.base_temp && <Pill text={ `Temp: ${val.climate.base_temp}` } color="orange" /> }
                                        { val.climate.weather && <Pill text={ `Weather: ${val.climate.weather}` } color="sky" /> }
                                        { val.climate.night_temp && <Pill text={ `Night: ${val.climate.night_temp}` } color="blue" /> }
                                    </div>
                                ) }
                                { val.terrain_flags && val.terrain_flags.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Terrain Flags</div>
                                        <div className="flex flex-wrap">{ val.terrain_flags.map(t => <Pill key={ t } text={ t } color="teal" />) }</div>
                                    </div>
                                ) }
                                { val.adaptation_rules && val.adaptation_rules.skills && val.adaptation_rules.skills.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Adaptation Skills</div>
                                        <div className="flex flex-wrap">{ val.adaptation_rules.skills.map(s => <Pill key={ s.id } text={ `${s.id} (${s.weight})` } color="green" />) }</div>
                                    </div>
                                ) }
                                { val.payloads && val.payloads.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Environmental Payloads</div>
                                        { val.payloads.map((p, i) => (
                                            <div key={ i } className="flex justify-between text-xs">
                                                <Pill text={ p.id } color="red" />
                                                <span className="text-gray-500">{ (p.chance_per_tick * 100).toFixed(0) }%</span>
                                            </div>
                                        )) }
                                    </div>
                                ) }
                            </DefCard>
                        );

                    case 'weather_types':
                        return (
                            <DefCard key={ key } title={ key }>
                                <p className="text-gray-400 text-xs leading-relaxed">{ val.description }</p>
                                { val.terrain_additions && val.terrain_additions.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Terrain Additions</div>
                                        <div className="flex flex-wrap">{ val.terrain_additions.map(t => <Pill key={ t } text={ t } color="teal" />) }</div>
                                    </div>
                                ) }
                                { val.payloads && val.payloads.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Payloads</div>
                                        { val.payloads.map((p, i) => (
                                            <div key={ i } className="flex justify-between text-xs">
                                                <Pill text={ p.id } color="sky" />
                                                <span className="text-gray-500">{ (p.chance_per_tick * 100).toFixed(0) }%</span>
                                            </div>
                                        )) }
                                    </div>
                                ) }
                            </DefCard>
                        );

                    case 'temperature_bands':
                        return (
                            <DefCard key={ key } title={ key }>
                                <p className="text-gray-400 text-xs leading-relaxed">{ val.description }</p>
                                { val.payloads && val.payloads.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Payloads</div>
                                        { val.payloads.map((p, i) => (
                                            <div key={ i } className="flex justify-between text-xs">
                                                <Pill text={ p.id } color="orange" />
                                                <span className="text-gray-500">{ (p.chance_per_tick * 100).toFixed(0) }%</span>
                                            </div>
                                        )) }
                                    </div>
                                ) }
                            </DefCard>
                        );

                    case 'status_effects':
                        return (
                            <DefCard key={ key } title={ key }>
                                <p className="text-gray-400 text-xs leading-relaxed">{ val.description }</p>
                                { val.blocks_skill_types && val.blocks_skill_types.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Blocks Skill Types</div>
                                        <div className="flex flex-wrap">{ val.blocks_skill_types.map(b => <Pill key={ b } text={ b } color="red" />) }</div>
                                    </div>
                                ) }
                                { val.mods && val.mods.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Modifiers</div>
                                        { val.mods.map((m, i) => (
                                            <div key={ i } className="font-mono text-xs text-green-300">
                                                { m.target } <span className="text-gray-500">{ m.op }</span> { m.expr }
                                                { m.damage_type && <Pill text={ m.damage_type } color="red" /> }
                                                { m.stat_dependencies && m.stat_dependencies.length > 0 && <span className="text-gray-600 ml-1">(deps: { m.stat_dependencies.join(', ') })</span> }
                                            </div>
                                        )) }
                                    </div>
                                ) }
                            </DefCard>
                        );

                    default:
                        return (
                            <DefCard key={ key } title={ key }>
                                <p className="text-gray-400 text-xs">{ val.description || '—' }</p>
                            </DefCard>
                        );
                }
            };

            return (
                <div className="p-3 sm:p-4 h-full flex flex-col">
                    {/* Section Selector Tabs */ }
                    <div className="flex flex-wrap gap-1 mb-3 pb-3 border-b border-neutral-800">
                        { DEF_SECTIONS.map(s => {
                            const count = Object.keys(s.source()).length;
                            const isActive = activeSection === s.key;
                            return (
                                <button
                                    key={ s.key }
                                    onClick={ () => { setActiveSection(s.key); setSearch(''); } }
                                    className={ `px-2 py-1 rounded text-xs font-bold transition-all border ${isActive
                                        ? `bg-neutral-800 border-neutral-600 ${s.color}`
                                        : 'border-transparent text-gray-500 hover:text-gray-300 hover:bg-neutral-900'
                                        }` }
                                >
                                    { s.label } <span className="opacity-60">({ count })</span>
                                </button>
                            );
                        }) }
                    </div>

                    {/* Search */ }
                    <div className="flex items-center gap-2 mb-3 bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2">
                        <Search size={ 14 } className="text-gray-500 shrink-0" />
                        <input
                            type="text"
                            value={ search }
                            onChange={ e => setSearch(e.target.value) }
                            placeholder={ `Search ${currentSection ? currentSection.label : ''}...` }
                            className="bg-transparent text-white text-sm outline-none flex-1 placeholder-gray-600"
                        />
                        { search && (
                            <button onClick={ () => setSearch('') } className="text-gray-500 hover:text-gray-300 text-xs">✕</button>
                        ) }
                        <span className="text-xs text-gray-600 shrink-0">{ filteredEntries.length } entries</span>
                    </div>

                    {/* Cards Grid */ }
                    <div className="flex-1 overflow-y-auto scroll-custom pr-1">
                        { filteredEntries.length === 0 ? (
                            <div className="text-gray-600 text-center italic mt-16">No entries match "{ search }"</div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                                { filteredEntries.map(([key, val]) => renderEntry(key, val)) }
                            </div>
                        ) }
                    </div>
                </div>
            );
        };

        const BattleView = () => {
            const [ent1, setEnt1] = useState(null);
            const [ent2, setEnt2] = useState(null);
            const [logs, setLogs] = useState([]);

            const setup = () => {
                const gen = (name) => {
                    const e = new Entity(name);
                    // Pick a chassis from live data
                    const chassisKeys = Object.keys(GAME_DATA.bodies.core.chassis);
                    if (!chassisKeys.length) return e;

                    const type = name.includes("Wolf")
                        ? (chassisKeys.find(k => k.toLowerCase().includes('cursorial') || k.toLowerCase().includes('wolf')) || chassisKeys[0])
                        : (chassisKeys.find(k => k.toLowerCase().includes('robust') || k.toLowerCase().includes('bear')) || chassisKeys[1] || chassisKeys[0]);

                    const chassis = GAME_DATA.bodies.core.chassis[type];
                    if (chassis) {
                        e.traits.push(type, ...(chassis.tags || []));
                        if (chassis.skills) e.skills.push(...chassis.skills);
                        if (chassis.mods) chassis.mods.forEach(m => e.applyMod(m.target, m.op, m.val, type));
                    }

                    e.skills.push("Bite");

                    Object.values(e.stats).forEach(s => { if (s instanceof PotentialStat) s.fill(); });
                    return e;
                };

                setEnt1(gen("Dire Wolf"));
                setEnt2(gen("Cave Bear"));
                setLogs(["Battle Initialized."]);
            };

            const fightTurn = () => {
                const hp1 = ent1 && (ent1.stats.hp_max || ent1.stats.hp), hp2 = ent2 && (ent2.stats.hp_max || ent2.stats.hp);
                if (!ent1 || !ent2 || hp1.currentValue <= 0 || hp2.currentValue <= 0) return;

                const newLogs = [...logs];

                const performAction = (attacker, defender) => {
                    const atkHp = attacker.stats.hp_max || attacker.stats.hp;
                    const defHp = defender.stats.hp_max || defender.stats.hp;
                    if (atkHp.currentValue <= 0) return;

                    const skillName = attacker.skills[Math.floor(Math.random() * attacker.skills.length)];
                    const skillData = GAME_DATA.skills[skillName];

                    if (!skillData) {
                        newLogs.push(`${attacker.name} hesitates.`);
                        return;
                    }

                    newLogs.push(`${attacker.name} uses ${skillName}!`);

                    skillData.mods.forEach(mod => {
                        if ((mod.target === "hp" || mod.target === "hp_max") && mod.op === "subtract") {
                            const dmg = attacker.roll(mod.roll);
                            const strMod = Math.floor((attacker.stats.str.getCurrentValue() - 10) / 2);
                            const totalDmg = Math.max(1, dmg + strMod);

                            defHp.currentValue -= totalDmg;
                            newLogs.push(`> Hits ${defender.name} for ${totalDmg} damage! (${defHp.currentValue.toFixed(0)} HP left)`);
                        }
                        if (mod.target === "status") {
                            newLogs.push(`> Applies ${mod.val} to ${defender.name}!`);
                        }
                    });
                };

                if (ent1.stats.dex.getCurrentValue() >= ent2.stats.dex.getCurrentValue()) {
                    performAction(ent1, ent2);
                    performAction(ent2, ent1);
                } else {
                    performAction(ent2, ent1);
                    performAction(ent1, ent2);
                }

                if (hp1.currentValue <= 0) newLogs.push(`💀 ${ent1.name} has been defeated!`);
                if (hp2.currentValue <= 0) newLogs.push(`💀 ${ent2.name} has been defeated!`);

                setLogs(newLogs);
                setEnt1(Object.assign(Object.create(Object.getPrototypeOf(ent1)), ent1));
                setEnt2(Object.assign(Object.create(Object.getPrototypeOf(ent2)), ent2));
            };

            return (
                <div className="p-3 sm:p-6 h-full flex flex-col">
                    <div className="flex justify-center gap-2 sm:gap-4 mb-3 sm:mb-4 flex-wrap">
                        <button onClick={ setup } className="bg-yellow-600 hover:bg-yellow-500 text-white px-4 sm:px-6 py-2 rounded-lg font-bold shadow-md flex items-center gap-2">
                            <RotateCcw size={ 18 } /> New Fight
                        </button>
                        <button
                            onClick={ fightTurn }
                            disabled={ !ent1 || (ent1.stats.hp_max || ent1.stats.hp || {}).currentValue <= 0 || (ent2.stats.hp_max || ent2.stats.hp || {}).currentValue <= 0 }
                            className="bg-red-600 hover:bg-red-500 disabled:opacity-50 disabled:cursor-not-allowed text-white px-8 py-2 rounded-lg font-bold shadow-md flex items-center gap-2"
                        >
                            <Swords size={ 18 } /> Next Turn
                        </button>
                    </div>

                    <div className="flex-1 grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 overflow-y-auto sm:overflow-hidden">
                        <div className="bg-neutral-900 rounded-lg p-4 border border-blue-900/50 flex flex-col">
                            { ent1 ? (
                                <>
                                    <h3 className="text-xl font-bold text-blue-400 flex items-center gap-2"><User size={ 20 } /> { ent1.name }</h3>
                                    { (() => {
                                        const h = ent1.stats.hp_max || ent1.stats.hp || { currentValue: 0, maxValue: 1 }; return (
                                            <div className="w-full bg-gray-800 h-6 rounded mt-2 border border-gray-700 relative overflow-hidden">
                                                <div className="bg-red-600 h-full transition-all duration-300" style={ { width: `${(h.currentValue / (h.maxValue || 1)) * 100}%` } }></div>
                                                <div className="absolute inset-0 flex items-center justify-center text-xs font-bold text-white shadow-black drop-shadow-md">
                                                    { h.currentValue.toFixed(0) } / { h.maxValue.toFixed(0) }
                                                </div>
                                            </div>);
                                    })() }
                                    <div className="mt-4 space-y-2 text-sm text-gray-400 bg-black/20 p-2 rounded">
                                        <div className="flex justify-between"><span>STR</span> <span className="text-white">{ Math.floor(ent1.stats.str.getCurrentValue()) }</span></div>
                                        <div className="flex justify-between"><span>DEX</span> <span className="text-white">{ Math.floor(ent1.stats.dex.getCurrentValue()) }</span></div>
                                        <div className="flex justify-between"><span>CON</span> <span className="text-white">{ Math.floor(ent1.stats.con.getCurrentValue()) }</span></div>
                                    </div>
                                </>
                            ) : <div className="text-gray-600 text-center mt-10">Waiting...</div> }
                        </div>

                        <div className="bg-black rounded-lg p-4 border border-neutral-700 overflow-y-auto scroll-custom font-mono text-sm relative">
                            { logs.map((l, i) => (
                                <div key={ i } className={ `mb-1 border-l-2 pl-2 ${l.includes('defeated') ? 'text-red-500 font-bold border-red-500' :
                                    l.includes('Hits') ? 'text-orange-300 border-orange-500' :
                                        l.includes('uses') ? 'text-cyan-300 border-cyan-500' :
                                            'text-gray-400 border-gray-700'
                                    }` }>
                                    { l }
                                </div>
                            )) }
                            { logs.length === 0 && <div className="text-gray-600 text-center italic mt-10 flex flex-col items-center gap-2"><Swords size={ 32 } /> Combat Log Ready</div> }
                        </div>

                        <div className="bg-neutral-900 rounded-lg p-4 border border-red-900/50 text-right flex flex-col">
                            { ent2 ? (
                                <>
                                    <h3 className="text-xl font-bold text-red-400 flex items-center justify-end gap-2">{ ent2.name } <User size={ 20 } /></h3>
                                    { (() => {
                                        const h = ent2.stats.hp_max || ent2.stats.hp || { currentValue: 0, maxValue: 1 }; return (
                                            <div className="w-full bg-gray-800 h-6 rounded mt-2 border border-gray-700 relative overflow-hidden">
                                                <div className="bg-red-600 h-full transition-all duration-300 absolute right-0" style={ { width: `${(h.currentValue / (h.maxValue || 1)) * 100}%` } }></div>
                                                <div className="absolute inset-0 flex items-center justify-center text-xs font-bold text-white shadow-black drop-shadow-md z-10">
                                                    { h.currentValue.toFixed(0) } / { h.maxValue.toFixed(0) }
                                                </div>
                                            </div>);
                                    })() }
                                    <div className="mt-4 space-y-2 text-sm text-gray-400 bg-black/20 p-2 rounded">
                                        <div className="flex justify-between"><span>STR</span> <span className="text-white">{ Math.floor(ent2.stats.str.getCurrentValue()) }</span></div>
                                        <div className="flex justify-between"><span>DEX</span> <span className="text-white">{ Math.floor(ent2.stats.dex.getCurrentValue()) }</span></div>
                                        <div className="flex justify-between"><span>CON</span> <span className="text-white">{ Math.floor(ent2.stats.con.getCurrentValue()) }</span></div>
                                    </div>
                                </>
                            ) : <div className="text-gray-600 text-center mt-10">Waiting...</div> }
                        </div>
                    </div>
                </div>
            )
        }

        const App = () => {
            const [tab, setTab] = useState('gen');

            return (
                <div className="h-screen flex flex-col bg-neutral-950 text-gray-100 font-sans">
                    <div className="bg-neutral-900 border-b border-neutral-800 px-3 py-2 sm:p-4 flex justify-between items-center gap-2 shadow-md z-10">
                        <h1 className="text-base sm:text-2xl font-black tracking-widest text-white flex items-center gap-1 sm:gap-2 shrink-0">
                            <Zap size={ 16 } className="text-blue-500 fill-current" />
                            <span className="text-blue-500">MADCORE</span>
                            <span className="hidden sm:inline">// RPG</span>
                        </h1>
                        <div className="flex gap-0.5 sm:gap-2 bg-neutral-950 p-1 rounded-lg border border-neutral-800">
                            <button onClick={ () => setTab('gen') } className={ `px-2 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-bold transition flex items-center gap-1 sm:gap-2 ${tab === 'gen' ? 'bg-neutral-800 text-blue-400 shadow-sm border border-neutral-700' : 'text-gray-500 hover:text-gray-300'}` }>
                                <Dice5 size={ 14 } /><span className="hidden sm:inline">Generator</span>
                            </button>
                            <button onClick={ () => setTab('grid') } className={ `px-2 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-bold transition flex items-center gap-1 sm:gap-2 ${tab === 'grid' ? 'bg-neutral-800 text-green-400 shadow-sm border border-neutral-700' : 'text-gray-500 hover:text-gray-300'}` }>
                                <Filter size={ 14 } /><span className="hidden sm:inline">Data Matrix</span>
                            </button>
                            <button onClick={ () => setTab('bat') } className={ `px-2 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-bold transition flex items-center gap-1 sm:gap-2 ${tab === 'bat' ? 'bg-neutral-800 text-red-400 shadow-sm border border-neutral-700' : 'text-gray-500 hover:text-gray-300'}` }>
                                <Swords size={ 14 } /><span className="hidden sm:inline">Simulation</span>
                            </button>
                            <button onClick={ () => setTab('def') } className={ `px-2 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-bold transition flex items-center gap-1 sm:gap-2 ${tab === 'def' ? 'bg-neutral-800 text-amber-400 shadow-sm border border-neutral-700' : 'text-gray-500 hover:text-gray-300'}` }>
                                <Activity size={ 14 } /><span className="hidden sm:inline">Definitions</span>
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 overflow-hidden relative">
                        { tab === 'gen' && <GeneratorView /> }
                        { tab === 'grid' && <DataGridView /> }
                        { tab === 'bat' && <BattleView /> }
                        { tab === 'def' && <DefinitionsView /> }
                    </div>
                </div>
            );
        };

        // Root wrapper that shows a loading screen until all JSON data is ready.
        const RootLoader = () => {
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState(null);

            useEffect(() => {
                initGameData()
                    .then(() => setIsLoading(false))
                    .catch(err => {
                        console.error('[GameData Loader] Fatal error:', err);
                        setLoadError(err.message);
                        setIsLoading(false);
                    });
            }, []);

            if (isLoading) {
                return (
                    <div style={ {
                        display: 'flex', flexDirection: 'column', alignItems: 'center',
                        justifyContent: 'center', height: '100vh',
                        background: '#0a0a0a', color: '#e5e5e5', gap: '16px'
                    } }>
                        <div style={ { fontSize: '2rem', fontWeight: 'bold', letterSpacing: '0.15em', color: '#3b82f6' } }>⚡ MADCORE</div>
                        <div style={ { fontSize: '1rem', color: '#6b7280', animation: 'pulse 1.5s infinite' } }>Loading Data Engine...</div>
                        <style>{ `@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }` }</style>
                    </div>
                );
            }

            if (loadError) {
                return (
                    <div style={ {
                        display: 'flex', flexDirection: 'column', alignItems: 'center',
                        justifyContent: 'center', height: '100vh',
                        background: '#0a0a0a', color: '#ef4444', gap: '12px'
                    } }>
                        <div style={ { fontSize: '1.5rem', fontWeight: 'bold' } }>⚠ Data Load Failed</div>
                        <div style={ { fontSize: '0.875rem', color: '#9ca3af', maxWidth: '500px', textAlign: 'center' } }>{ loadError }</div>
                        <div style={ { fontSize: '0.75rem', color: '#6b7280' } }>Make sure the page is served via a local web server (e.g. python -m http.server 8080)</div>
                    </div>
                );
            }

            return <App />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RootLoader />);
    </script>
</body>

</html>
