                                { val.payloads && val.payloads.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Payloads</div>
                                        { val.payloads.map((p, i) => (
                                            <div key={ i } className="flex justify-between text-xs">
                                                <Pill text={ p.id } color="orange" />
                                                <span className="text-gray-500">{ (p.chance_per_tick * 100).toFixed(0) }%</span>
                                            </div>
                                        )) }
                                    </div>
                                ) }
                            </DefCard>
                        );
                    }

                    case 'biomes':
                        return (
                            <DefCard key={ key } title={ val.name || key }>
                                <p className="text-gray-400 text-xs leading-relaxed">{ val.description }</p>
                                { val.climate && (
                                    <div className="text-xs flex gap-2 flex-wrap">
                                        { val.climate.base_temp && <Pill text={ `Temp: ${val.climate.base_temp}` } color="orange" /> }
                                        { val.climate.weather && <Pill text={ `Weather: ${val.climate.weather}` } color="sky" /> }
                                        { val.climate.night_temp && <Pill text={ `Night: ${val.climate.night_temp}` } color="blue" /> }
                                    </div>
                                ) }
                                { val.terrain_flags && val.terrain_flags.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Terrain Flags</div>
                                        <div className="flex flex-wrap">{ val.terrain_flags.map(t => <Pill key={ t } text={ t } color="teal" />) }</div>
                                    </div>
                                ) }
                                { val.adaptation_rules && val.adaptation_rules.skills && val.adaptation_rules.skills.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Adaptation Skills</div>
                                        <div className="flex flex-wrap">{ val.adaptation_rules.skills.map(s => <Pill key={ s.id } text={ `${s.id} (${s.weight})` } color="green" />) }</div>
                                    </div>
                                ) }
                                { val.payloads && val.payloads.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Environmental Payloads</div>
                                        { val.payloads.map((p, i) => (
                                            <div key={ i } className="flex justify-between text-xs">
                                                <Pill text={ p.id } color="red" />
                                                <span className="text-gray-500">{ (p.chance_per_tick * 100).toFixed(0) }%</span>
                                            </div>
                                        )) }
                                    </div>
                                ) }
                            </DefCard>
                        );

                    case 'weather_types':
                        return (
                            <DefCard key={ key } title={ key }>
                                <p className="text-gray-400 text-xs leading-relaxed">{ val.description }</p>
                                { val.terrain_additions && val.terrain_additions.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Terrain Additions</div>
                                        <div className="flex flex-wrap">{ val.terrain_additions.map(t => <Pill key={ t } text={ t } color="teal" />) }</div>
                                    </div>
                                ) }
                                { val.payloads && val.payloads.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Payloads</div>
                                        { val.payloads.map((p, i) => (
                                            <div key={ i } className="flex justify-between text-xs">
                                                <Pill text={ p.id } color="sky" />
                                                <span className="text-gray-500">{ (p.chance_per_tick * 100).toFixed(0) }%</span>
                                            </div>
                                        )) }
                                    </div>
                                ) }
                            </DefCard>
                        );

                    case 'temperature_bands':
                        return (
                            <DefCard key={ key } title={ key }>
                                <p className="text-gray-400 text-xs leading-relaxed">{ val.description }</p>
                                { val.payloads && val.payloads.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Payloads</div>
                                        { val.payloads.map((p, i) => (
                                            <div key={ i } className="flex justify-between text-xs">
                                                <Pill text={ p.id } color="orange" />
                                                <span className="text-gray-500">{ (p.chance_per_tick * 100).toFixed(0) }%</span>
                                            </div>
                                        )) }
                                    </div>
                                ) }
                            </DefCard>
                        );

                    case 'status_effects':
                        return (
                            <DefCard key={ key } title={ key }>
                                <p className="text-gray-400 text-xs leading-relaxed">{ val.description }</p>
                                { val.blocks_skill_types && val.blocks_skill_types.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Blocks Skill Types</div>
                                        <div className="flex flex-wrap">{ val.blocks_skill_types.map(b => <Pill key={ b } text={ b } color="red" />) }</div>
                                    </div>
                                ) }
                                { val.mods && val.mods.length > 0 && (
                                    <div>
                                        <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Modifiers</div>
                                        { val.mods.map((m, i) => (
                                            <div key={ i } className="font-mono text-xs text-green-300">
                                                { m.target } <span className="text-gray-500">{ m.op }</span> { m.expr }
                                                { m.damage_type && <Pill text={ m.damage_type } color="red" /> }
                                                { m.stat_dependencies && m.stat_dependencies.length > 0 && <span className="text-gray-600 ml-1">(deps: { m.stat_dependencies.join(', ') })</span> }
                                            </div>
                                        )) }
                                    </div>
                                ) }
                            </DefCard>
                        );

                    default:
                        return (
                            <DefCard key={ key } title={ key }>
                                <p className="text-gray-400 text-xs">{ val.description || '—' }</p>
                            </DefCard>
                        );
                }
            };

            return (
                <div className="p-3 sm:p-4 h-full flex flex-col">
                    {/* Section Selector Tabs */ }
                    <div className="flex flex-wrap gap-1 mb-3 pb-3 border-b border-neutral-800">
                        { DEF_SECTIONS.map(s => {
                            const count = Object.keys(s.source()).length;
                            const isActive = activeSection === s.key;
                            return (
                                <button
                                    key={ s.key }
                                    onClick={ () => { setActiveSection(s.key); setSearch(''); } }
                                    className={ `px-2 py-1 rounded text-xs font-bold transition-all border ${isActive
                                        ? `bg-neutral-800 border-neutral-600 ${s.color}`
                                        : 'border-transparent text-gray-500 hover:text-gray-300 hover:bg-neutral-900'
                                        }` }
                                >
                                    { s.label } <span className="opacity-60">({ count })</span>
                                </button>
                            );
                        }) }
                    </div>

                    {/* Search */ }
                    <div className="flex items-center gap-2 mb-3 bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2">
                        <Search size={ 14 } className="text-gray-500 shrink-0" />
                        <input
                            type="text"
                            value={ search }
                            onChange={ e => setSearch(e.target.value) }
                            placeholder={ `Search ${currentSection ? currentSection.label : ''}...` }
                            className="bg-transparent text-white text-sm outline-none flex-1 placeholder-gray-600"
                        />
                        { search && (
                            <button onClick={ () => setSearch('') } className="text-gray-500 hover:text-gray-300 text-xs">✕</button>
                        ) }
                        <span className="text-xs text-gray-600 shrink-0">{ filteredEntries.length } entries</span>
                    </div>

                    {/* Cards Grid */ }
                    <div className="flex-1 overflow-y-auto scroll-custom pr-1">
                        { filteredEntries.length === 0 ? (
                            <div className="text-gray-600 text-center italic mt-16">No entries match "{ search }"</div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                                { filteredEntries.map(([key, val]) => renderEntry(key, val)) }
                            </div>
                        ) }
                    </div>
                </div>
            );
        };

        // ==========================================
        // SHARED ENTITY GENERATION HELPER
        // ==========================================
        function generateEntity() {
            // Generate a short unique hex ID for this entity instance
            const uid = Math.floor(Math.random() * 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
            const e = new Entity(`Entity-${uid}`);

            const pick = (obj) => {
                if (!obj) return null;
                const keys = Object.keys(obj);
                if (!keys.length) return null;
                const key = keys[Math.floor(Math.random() * keys.length)];
                return { key, ...obj[key] };
            };

            const pickFiltered = (obj, pred) => {
                if (!obj) return null;
                const keys = Object.keys(obj).filter(k => pred(obj[k]));
                if (!keys.length) return null;
                const key = keys[Math.floor(Math.random() * keys.length)];
                return { key, ...obj[key] };
            };

            // Helper: apply a part's mods and skills to the entity
            const applyPart = (part, label) => {
                if (!part) return;
                if (part.mods) part.mods.forEach(m => e.applyMod(m.target, m.op, m.val, label));
                if (part.grants_skills) e.skills.push(...part.grants_skills);
                if (part.skills) e.skills.push(...part.skills);
            };

            // 1. Chassis
            const chassis = pick(GAME_DATA.bodies.core.chassis);
            if (chassis) {
                e.traits.push(chassis.key);
                e.traits.push(...(chassis.tags || []));
                if (chassis.skills) e.skills.push(...chassis.skills);
                if (chassis.mods) chassis.mods.forEach(m => e.applyMod(m.target, m.op, m.val, chassis.key));
            }

            const slots = (chassis && chassis.slots) ? chassis.slots : [];
            e.anatomy = {}; // Store picked anatomy keys for prompt building

            // --- Generate a clean display name from chassis visual tag ---
            const chassisTags = (chassis && chassis.tags) ? chassis.tags : [];
            const visualTag = chassisTags.find(t => t.endsWith('_Like'));
            const speciesName = visualTag
                ? visualTag.replace('_Like', '').replace(/_/g, ' ')
                : (chassis ? chassis.key.replace('_Frame', '').replace(/_/g, ' ') : 'Unknown');
            e.name = `${speciesName} [#${uid}]`;

            // 2. Head cephalon parts (only if chassis has a Head slot)
            const hasHead = slots.some(s => s === 'Head' || s === 'Cephalothorax');
            if (hasHead) {
                // Cranium
                const cranium = pickFiltered(GAME_DATA.bodies.cephalon.cranium, (item) =>
                    !item.tags || item.tags.some(t => e.traits.includes(t))
                ) || pick(GAME_DATA.bodies.cephalon.cranium);
                if (cranium) {
                    e.parts.push(cranium.key);
                    applyPart(cranium, cranium.key);
                }

                // Eyes
                const eyes = pickFiltered(GAME_DATA.bodies.cephalon.eyes, (item) =>
                    item.tags && item.tags.some(t => e.traits.includes(t))
                ) || pick(GAME_DATA.bodies.cephalon.eyes);
                if (eyes) {
                    e.parts.push(eyes.key);
                    e.anatomy.eyes = eyes.key;
                    applyPart(eyes, eyes.key);
                }

                // Ears
                const ears = pickFiltered(GAME_DATA.bodies.cephalon.ears, (item) =>
                    item.tags && item.tags.some(t => e.traits.includes(t))
                ) || pick(GAME_DATA.bodies.cephalon.ears);
                if (ears) {
                    e.parts.push(ears.key);
                    e.anatomy.ears = ears.key;
                    applyPart(ears, ears.key);
                }

                // Maw
                const maw = pickFiltered(GAME_DATA.bodies.cephalon.maw, (item) =>
                    item.tags && item.tags.some(t => e.traits.includes(t))
                ) || pick(GAME_DATA.bodies.cephalon.maw);
                if (maw) {
                    e.parts.push(maw.key);
                    e.anatomy.maw = maw.key;
                    applyPart(maw, maw.key);
                }

                // Nose
                const nose = pickFiltered(GAME_DATA.bodies.cephalon.nose, (item) =>
                    item.tags && item.tags.some(t => e.traits.includes(t))
                ) || pick(GAME_DATA.bodies.cephalon.nose);
                if (nose) {
                    e.parts.push(nose.key);
                    e.anatomy.nose = nose.key;
                    applyPart(nose, nose.key);
                }
            }

            // 3. Integument (skin/scales/fur)
            const integument = pickFiltered(GAME_DATA.bodies.core.integument, (item) =>
                item.tags && item.tags.some(t => e.traits.includes(t))
            );
            if (integument) {
                e.parts.push(integument.key);
                if (integument.mods) integument.mods.forEach(m => e.applyMod(m.target, m.op, m.val, integument.key));
            }

            // 4. Appendages — chosen by slot type
            const slotToData = {
                'Arms': { pool: GAME_DATA.bodies.appendages.arms, key: 'arms' },
                'Legs': { pool: GAME_DATA.bodies.appendages.legs, key: 'legs' },
                'Fore_Limbs': { pool: GAME_DATA.bodies.appendages.legs, key: 'legs' },
                'Hind_Limbs': { pool: GAME_DATA.bodies.appendages.legs, key: 'hind_legs' },
                'Wings': { pool: GAME_DATA.bodies.appendages.wings, key: 'wings' },
                'Fins': { pool: GAME_DATA.bodies.appendages.fins, key: 'fins' },
                'Tail': { pool: GAME_DATA.bodies.appendages.tails, key: 'tails' },
                'Tentacles': { pool: GAME_DATA.bodies.appendages.tentacles, key: 'tentacles' },
                'Legs_x6': { pool: GAME_DATA.bodies.appendages.legs, key: 'legs' },
                'Legs_x8': { pool: GAME_DATA.bodies.appendages.legs, key: 'legs' },
            };
            const seenAppendageKeys = new Set();
            slots.forEach(slot => {
                const mapping = slotToData[slot];
                if (!mapping || seenAppendageKeys.has(mapping.key)) return;
                seenAppendageKeys.add(mapping.key);
                const part = pickFiltered(mapping.pool, (item) =>
                    item.tags && item.tags.some(t => e.traits.includes(t))
                ) || pick(mapping.pool);
                if (part) {
                    e.parts.push(part.key);
                    e.anatomy[mapping.key] = part.key;
                    applyPart(part, part.key);
                    // Add traversal tags to traits for sensory cross-reference
                    if (part.traversal) e.traits.push(...part.traversal);
                }
            });

            // 5. Variations
            e.variations = {};
            const biome = pick(GAME_DATA.variations.biomes);
            if (biome) e.variations.biome = biome.key;
            const pattern = pick(GAME_DATA.variations.appearances.patterns);
            if (pattern) e.variations.pattern = pattern.key;
            const pig = pick(GAME_DATA.variations.appearances.pigmentation);
            if (pig) {
                e.variations.pigmentation = pig.key;
                // Apply pigmentation mods
                if (pig.mods) pig.mods.forEach(m => e.applyMod(m.target, m.op, m.val, pig.key));
            }
            const size = pick(GAME_DATA.variations.size_indices);
            if (size) e.variations.size = size.key;
            const bioUpgrade = Math.random() > 0.7 ? pick(GAME_DATA.variations.biological_upgrades) : null;
            if (bioUpgrade) {
                e.variations.upgrade = bioUpgrade.key;
                if (bioUpgrade.mods) bioUpgrade.mods.forEach(m => e.applyMod(m.target, m.op, m.val, bioUpgrade.key));
            }

            // 6. Loot
            e.loot = [];
            const anatomyDrops = GAME_DATA.loot.anatomy_drops || {};
            const allTags = new Set([...e.traits, ...e.parts]);
            Object.keys(anatomyDrops).forEach(key => {
                if (allTags.has(key) || Array.from(allTags).some(t => t.includes(key) || key.includes(t))) {
                    e.loot.push({ name: key, ...anatomyDrops[key] });
                }
            });
            if (e.loot.length === 0 && chassis) {
                if (anatomyDrops["Meat_Muscle"]) e.loot.push({ name: "Meat_Muscle", ...anatomyDrops["Meat_Muscle"] });
                if (anatomyDrops["Legs_Bones"]) e.loot.push({ name: "Legs_Bones", ...anatomyDrops["Legs_Bones"] });
            }

            // 7. Prefix
            if (Math.random() > 0.5) {
                const prefix = pick(GAME_DATA.prefixes);
                if (prefix) {
                    e.traits.push(prefix.key);
                    if (prefix.mods) prefix.mods.forEach(m => e.applyMod(m.target, m.op, m.val, prefix.key));
                }
            }

            // Ensure the entity has at least one attack skill
            const hasAttack = e.skills.some(skillName => {
                const types = GAME_DATA.skills[skillName]?.types || [];
                return types.includes('Melee_Attack') || types.includes('Ranged_Attack');
            });
            if (!hasAttack) e.skills.push('Unarmed');

            Object.values(e.stats).forEach(s => { if (s instanceof PotentialStat) s.fill(); });
            return e;
        }

        // ==========================================
        // ENTITY CHARACTER SHEET MODAL
        // ==========================================
        const EntitySheetModal = ({ entity, onClose }) => {
            if (!entity) return null;
            const hpStat = entity.stats.hp_max || entity.stats.hp || { currentValue: 0, maxValue: 0 };
            const displayName = `${entity.traits.find(t => GAME_DATA.prefixes[t]) || ''} ${entity.traits[0] || entity.name}`.trim();
            return (
                <div
                    className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm"
                    onClick={ onClose }
                >
                    <div
                        className="bg-neutral-900 border border-neutral-700 rounded-xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden"
                        onClick={ e => e.stopPropagation() }
                    >
                        {/* Modal Header */ }
                        <div className="flex justify-between items-start p-4 border-b border-neutral-700 flex-shrink-0">
                            <div>
                                <h2 className="text-2xl font-bold text-yellow-400 flex items-center gap-2">
                                    <PawPrint size={ 22 } className="text-yellow-600" />
                                    { displayName }
                                </h2>
                                <div className="flex gap-1 mt-1 flex-wrap">
                                    { entity.traits.slice(1).map((t, i) => (
                                        <span key={ i } className="bg-neutral-700 px-2 py-0.5 rounded text-xs text-gray-300 border border-neutral-600">{ t }</span>
                                    )) }
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="text-right">
                                    <div className="text-2xl font-bold text-red-400 flex items-center gap-1">
                                        <Activity size={ 18 } className="text-red-600" />
                                        { Math.floor(hpStat.currentValue) }
                                        <span className="text-sm text-gray-500">/ { Math.floor(hpStat.maxValue) } HP</span>
                                    </div>
                                </div>
                                <button
                                    onClick={ onClose }
                                    className="text-gray-500 hover:text-white text-xl font-bold leading-none transition-colors"
                                >✕</button>
                            </div>
                        </div>

                        {/* Modal Body */ }
                        <div className="overflow-y-auto scroll-custom p-4 flex-1">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {/* Left column */ }
                                <div className="space-y-4">
                                    <div className="bg-neutral-800 p-3 rounded-lg border border-neutral-700">
                                        <h3 className="text-sm font-bold text-blue-400 mb-2 border-b border-neutral-700 pb-1 flex items-center gap-1">
                                            <User size={ 14 } /> Attributes
                                        </h3>
                                        <div className="grid grid-cols-2 gap-1">
                                            { Object.values(entity.stats).filter(s => s.def.statType === "Raw").map(s => (
                                                <div key={ s.def.id } className="flex justify-between items-center p-1.5 hover:bg-neutral-700/50 rounded">
                                                    <span className="text-gray-400 text-xs">{ s.def.displayName }</span>
                                                    <span className="font-mono font-bold text-white text-sm">{ Math.floor(s.getCurrentValue()) }</span>
                                                </div>
                                            )) }
                                        </div>
                                    </div>
                                    <div className="bg-neutral-800 p-3 rounded-lg border border-neutral-700">
                                        <h3 className="text-sm font-bold text-yellow-600 mb-2 border-b border-neutral-700 pb-1 flex items-center gap-1">
                                            <Anchor size={ 14 } /> Loot
                                        </h3>
                                        { entity.loot && entity.loot.length > 0 ? entity.loot.map((l, i) => (
                                            <div key={ i } className="text-xs mb-1">
                                                <span className="text-gray-200 font-bold">{ l.name.replace(/_/g, ' ') }</span>
                                                <span className="text-gray-500 ml-1">— { l.baseDrops ? l.baseDrops.join(", ") : "Nothing" }</span>
                                            </div>
                                        )) : <span className="text-gray-500 italic text-xs">No significant loot.</span> }
                                    </div>
                                </div>
                                {/* Right column */ }
                                <div className="space-y-4">
                                    <div className="bg-neutral-800 p-3 rounded-lg border border-neutral-700">
                                        <h3 className="text-sm font-bold text-green-400 mb-2 border-b border-neutral-700 pb-1 flex items-center gap-1">
                                            <Shield size={ 14 } /> Derived Status
                                        </h3>
                                        { Object.values(entity.stats).filter(s => s instanceof PotentialStat && s.def.id !== "hp").map(s => (
                                            <div key={ s.def.id } className="flex justify-between py-0.5 text-xs">
                                                <span className="text-gray-300">{ s.def.displayName }</span>
                                                <span className="font-mono text-yellow-400">{ Math.floor(s.maxValue) }</span>
                                            </div>
                                        )) }
                                    </div>
                                    <div className="bg-neutral-800 p-3 rounded-lg border border-neutral-700">
                                        <h3 className="text-sm font-bold text-purple-400 mb-2 border-b border-neutral-700 pb-1 flex items-center gap-1">
                                            <Anchor size={ 14 } /> Anatomy & Skills
                                        </h3>
                                        <div className="mb-2">
                                            <span className="text-xs text-gray-500 uppercase font-bold tracking-wider">Parts</span>
                                            <div className="flex flex-wrap gap-1 mt-1">
                                                { entity.parts.map((p, i) => <span key={ i } className="bg-purple-900/40 border border-purple-700 text-purple-200 px-2 py-0.5 rounded text-xs">{ p }</span>) }
                                            </div>
                                        </div>
                                        <div>
                                            <span className="text-xs text-gray-500 uppercase font-bold tracking-wider">Abilities</span>
                                            <div className="flex flex-wrap gap-1 mt-1">
                                                { entity.skills.map((s, i) => <span key={ i } className="bg-blue-900/40 border border-blue-700 text-blue-200 px-2 py-0.5 rounded text-xs">{ s }</span>) }
                                            </div>
                                        </div>
                                    </div>
                                    { entity.variations && (
                                        <div className="bg-neutral-800 p-3 rounded-lg border border-neutral-700">
                                            <h3 className="text-sm font-bold text-teal-400 mb-2 border-b border-neutral-700 pb-1 flex items-center gap-1">
                                                <Search size={ 14 } /> Variations
                                            </h3>
                                            <div className="space-y-1 text-xs">
                                                { entity.variations.biome && <div className="flex justify-between"><span className="text-gray-400">Biome</span><span className="text-white">{ entity.variations.biome }</span></div> }
                                                { entity.variations.pattern && <div className="flex justify-between"><span className="text-gray-400">Pattern</span><span className="text-white">{ entity.variations.pattern }</span></div> }
                                                { entity.variations.pigmentation && <div className="flex justify-between"><span className="text-gray-400">Pigment</span><span className="text-white">{ entity.variations.pigmentation }</span></div> }
                                                { entity.variations.size && <div className="flex justify-between"><span className="text-gray-400">Size</span><span className="text-white">{ entity.variations.size }</span></div> }
                                                { entity.variations.upgrade && <div className="flex justify-between"><span className="text-gray-400">Upgrade</span><span className="text-purple-300">{ entity.variations.upgrade }</span></div> }
                                            </div>
                                        </div>
                                    ) }
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // BATTLE VIEW (Grid Arena)
        // ==========================================
        const ARENA_SIZE = 12; // 12×12 total; inner playable zone is 10×10 (cells 1–10)

        // Returns a shallow-cloned entity to trigger React re-render
        const cloneEntity = (e) => Object.assign(Object.create(Object.getPrototypeOf(e)), e);

        // Chebyshev distance (diagonal = 1 tile)
        const gridDist = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));

        const BattleView = () => {
            const [entA, setEntA] = useState(null);
            const [entB, setEntB] = useState(null);
            const [logs, setLogs] = useState([]);
            const [modalEntity, setModalEntity] = useState(null);
            const [isAuto, setIsAuto] = useState(false);
            const logEndRef = React.useRef(null);
            const fightTurnRef = React.useRef(null);

            // Auto-scroll log to bottom
            useEffect(() => {
                if (logEndRef.current) logEndRef.current.scrollIntoView({ behavior: 'smooth' });
            }, [logs]);

            const getHp = (e) => e && (e.stats.hp_max || e.stats.hp);
            const getDisplayName = (e) => {
                if (!e) return '?';
                const prefix = e.traits.find(t => GAME_DATA.prefixes[t]) || '';
                return `${prefix} ${e.traits[0] || e.name}`.trim();
            };

            const setup = () => {
                const a = generateEntity();
                const b = generateEntity();
                // Random spawn in playable inner zone (1..ARENA_SIZE-2)
                const randPos = () => 1 + Math.floor(Math.random() * (ARENA_SIZE - 2));
                do { a.x = randPos(); a.y = randPos(); } while (false);
                do { b.x = randPos(); b.y = randPos(); } while (a.x === b.x && a.y === b.y);

                // Assign random behavior profiles
                const behaviorKeys = Object.keys(GAME_DATA.mechanics.behaviors);
                const pickBehavior = () => behaviorKeys.length
                    ? behaviorKeys[Math.floor(Math.random() * behaviorKeys.length)]
                    : null;
                a.behaviorKey = pickBehavior();
                b.behaviorKey = pickBehavior();

                setEntA(a);
                setEntB(b);
                setLogs([
                    `⚔ A new battle begins!`,
                    `  ▶ ${getDisplayName(a)} [${a.behaviorKey || 'No Behavior'}]`,
                    `  ◀ ${getDisplayName(b)} [${b.behaviorKey || 'No Behavior'}]`
                ]);
                setModalEntity(null);
                setIsAuto(false);
            };

            // ── Tag-Weighted Behavior Engine ───────────────────────────────────
            //
            // Scoring pipeline per entity turn:
            //   1. Load behavior profile → build active weight map (base_weights copy)
            //   2. Evaluate conditional_modifiers (distance / hp_percent conditions)
            //      and apply weight_shifts to the active weight map
            //   3. Score each skill: sum active weights for every type tag on that skill
            //   4. Pick highest-scoring skill.
            //      • If it carries the "Movement" type tag  → MOVE node
            //      • Otherwise                              → ATTACK node (deal damage)

            const evaluateBehavior = (entity, target, newLogs) => {
                // Persist usage counts across turns on the entity object
                if (!entity.usageCounts) entity.usageCounts = {};

                const atkHp = getHp(entity);
                const defHp = getHp(target);
                if (!atkHp || atkHp.currentValue <= 0) return;

                // ── 1. Build active weight map ─────────────────────────────
                const profile = entity.behaviorKey
                    ? GAME_DATA.mechanics.behaviors[entity.behaviorKey]
                    : null;

                // Clone base_weights (or start empty)
                const activeWeights = profile
                    ? { ...profile.base_weights }
                    : { Melee_Attack: 50, Movement: 10 }; // minimal fallback

                // ── 2. Evaluate conditional_modifiers ─────────────────────
                if (profile && profile.conditional_modifiers) {
                    const dist = gridDist(entity, target);
                    const hpPct = atkHp.maxValue > 0 ? atkHp.currentValue / atkHp.maxValue : 1;

                    profile.conditional_modifiers.forEach(mod => {
                        let triggered = false;
                        const cond = (mod.condition || '').trim();

                        // Simple expression parser: "<key> <op> <value>"
                        const match = cond.match(/^(\w+)\s*([><=!]+)\s*([\d.]+)$/);
                        if (match) {
                            const [, varName, op, rawVal] = match;
                            const val = parseFloat(rawVal);
                            const lhs = varName === 'distance' ? dist
                                : varName === 'hp_percent' ? hpPct
                                    : null;
                            if (lhs !== null) {
                                if (op === '>' && lhs > val) triggered = true;
                                if (op === '>=' && lhs >= val) triggered = true;
                                if (op === '<' && lhs < val) triggered = true;
                                if (op === '<=' && lhs <= val) triggered = true;
                                if (op === '==' && lhs === val) triggered = true;
                            }
                        }

                        if (triggered) {
                            Object.entries(mod.weight_shifts || {}).forEach(([tag, delta]) => {
                                activeWeights[tag] = (activeWeights[tag] || 0) + delta;
                            });
                        }
                    });
                }

                // ── 3. Score every skill — cumulative weighted lottery ────────
                const validSkills = [];

                entity.skills.forEach(skillName => {
                    const skillData = GAME_DATA.skills[skillName];
                    if (!skillData) return;
                    const types = skillData.types || [];
                    // Skip Passive-only skills — they are always-on traits, not turn actions
                    if (types.length > 0 && types.every(t => t === 'Passive')) return;

                    // Base score from behavior weights
                    let score = types.reduce((sum, t) => sum + (activeWeights[t] || 0), 0);
                    // Diminishing returns: -40 per previous use this fight
                    score -= (entity.usageCounts[skillName] || 0) * 40;

                    if (score > 0) validSkills.push({ name: skillName, score, types });
                });

                // Rescue pass: if every skill scored ≤ 0 (mixed types like Passive+Movement
                // go negative from behavior Passive weight, or usage penalty drained all),
                // pick the best non-passive skill ignoring penalties so the actual skill
                // expr fires instead of the 1d4 "strikes wildly" emergency fallback.
                if (validSkills.length === 0) {
                    let rescueName = null, rescueTypes = [], rescueScore = -Infinity;
                    entity.skills.forEach(skillName => {
                        const sd = GAME_DATA.skills[skillName];
                        if (!sd) return;
                        const t = sd.types || [];
                        if (t.every(x => x === 'Passive')) return;
                        const raw = t.reduce((sum, x) => sum + (activeWeights[x] || 0), 0);
                        if (raw > rescueScore) { rescueScore = raw; rescueName = skillName; rescueTypes = t; }
                    });
                    if (rescueName) {
                        entity.usageCounts[rescueName] = 0; // reset so it re-enters lottery next turn
                        validSkills.push({ name: rescueName, score: 1, types: rescueTypes });
                    }
                }

                let bestSkillName = null;
                let types = [];

                if (validSkills.length === 0) {
                    const distFb = gridDist(entity, target);
                    if (distFb <= 1) {
                        // All skills penalized out while in melee range — reset counters
                        // so the lottery can run fresh next turn, and deal raw unarmed damage now.
                        entity.usageCounts = {};
                        const rawDmg = Math.max(1, Math.floor(Math.random() * 4) + 1);
                        defHp.currentValue = Math.max(0, defHp.currentValue - rawDmg);
                        newLogs.push(`👊 ${getDisplayName(entity)} strikes wildly for ${rawDmg} [Physical] → ${defHp.currentValue.toFixed(0)} HP left`);
                    } else {
                        // Still closing — move one tile toward target
                        const dx = Math.sign(target.x - entity.x);
                        const dy = Math.sign(target.y - entity.y);
                        entity.x = Math.max(1, Math.min(ARENA_SIZE - 2, entity.x + dx));
                        entity.y = Math.max(1, Math.min(ARENA_SIZE - 2, entity.y + dy));
                        newLogs.push(`🦶 ${getDisplayName(entity)} closes in → (${entity.x},${entity.y}).`);
                    }
                    return;
                }

                // Weighted random draw
                const totalWeight = validSkills.reduce((sum, s) => sum + s.score, 0);
                let roll = Math.random() * totalWeight;
                for (const skill of validSkills) {
                    roll -= skill.score;
                    if (roll <= 0) { bestSkillName = skill.name; types = skill.types; break; }
                }
                // Float safety net
                if (!bestSkillName) {
                    bestSkillName = validSkills[validSkills.length - 1].name;
                    types = validSkills[validSkills.length - 1].types;
                }

                // Track usage for diminishing returns next turn
                entity.usageCounts[bestSkillName] = (entity.usageCounts[bestSkillName] || 0) + 1;

                const skillData = GAME_DATA.skills[bestSkillName];
                // `types` is already set by the weighted lottery above

                // ── 4a. MOVE NODE ─────────────────────────────────────────
                // Only actually move if not already in melee range (dist > 1).
                // If already adjacent/same tile, fall through to the attack node
                // so entities with only Movement skills can still deal damage.
                const distNow = gridDist(entity, target);
                if (types.includes('Movement') && distNow > 1) {
                    const hpPct = atkHp.maxValue > 0 ? atkHp.currentValue / atkHp.maxValue : 1;
                    const isRetreating = (activeWeights['Melee_Attack'] || 0) < 0 && hpPct < 0.4;
                    const dx = Math.sign(target.x - entity.x) * (isRetreating ? -1 : 1);
                    const dy = Math.sign(target.y - entity.y) * (isRetreating ? -1 : 1);
                    entity.x = Math.max(1, Math.min(ARENA_SIZE - 2, entity.x + dx));
                    entity.y = Math.max(1, Math.min(ARENA_SIZE - 2, entity.y + dy));
                    const verb = isRetreating ? '💨 retreats' : '🦶 moves';
                    newLogs.push(`${verb}: ${getDisplayName(entity)} → (${entity.x},${entity.y}) [${bestSkillName}]`);
                    return;
                }

                // ── 4b. ATTACK / EFFECT NODE ─────────────────────────────
                const dist = gridDist(entity, target);
                if (dist > 1) {
                    // Not in melee range yet — move instead
                    const dx = Math.sign(target.x - entity.x);
                    const dy = Math.sign(target.y - entity.y);
                    entity.x = Math.max(1, Math.min(ARENA_SIZE - 2, entity.x + dx));
                    entity.y = Math.max(1, Math.min(ARENA_SIZE - 2, entity.y + dy));
                    newLogs.push(`🦶 ${getDisplayName(entity)} closes in → (${entity.x},${entity.y}) [wanted: ${bestSkillName}]`);
                    return;
                }

                const flavor = skillData.description && skillData.description !== 'No description'
                    ? ` (${skillData.description})` : '';
                newLogs.push(`⚡ ${getDisplayName(entity)} uses ${bestSkillName}!${flavor}`);

                (skillData.mods || []).forEach(mod => {
                    if ((mod.target === 'hp' || mod.target === 'hp_max') && mod.op === 'subtract') {
                        // Evaluate expr: replace stat names and 'level' with their values
                        let expr = (mod.expr || '').replace(/\b([a-zA-Z_]+)\b/g, (statOrLevel) => {
                            if (statOrLevel === 'level') return entity.level || 1;
                            const s = entity.stats[statOrLevel];
                            return s ? Math.floor(s.getCurrentValue()) : statOrLevel;
                        });
                        // Evaluate dice notation (e.g. 2d6 → random)
                        expr = expr.replace(/(\d+)d(\d+)/g, (_, num, sides) => {
                            let total = 0;
                            for (let i = 0; i < +num; i++) total += Math.floor(Math.random() * +sides) + 1;
                            return total;
                        });
                        let dmg = 1;
                        try { dmg = Math.max(1, Math.floor(new Function('return ' + expr)())); } catch (e) { }
                        defHp.currentValue = Math.max(0, defHp.currentValue - dmg);
                        newLogs.push(`  ↳ Hits ${getDisplayName(target)} for ${dmg} [${mod.damage_type || 'Physical'}] → ${defHp.currentValue.toFixed(0)} HP left`);
                    }
                    if (mod.target === 'status') {
                        newLogs.push(`  ↳ Applies [${mod.val}] to ${getDisplayName(target)}!`);
                    }
                });

                // Log payloads (status effects on hit)
                (skillData.payloads || []).forEach(p => {
                    if (Math.random() < p.chance_per_tick) {
                        newLogs.push(`  ↳ 🔴 ${getDisplayName(target)} suffers [${p.id}] for ${p.duration_ticks} ticks!`);
                    }
                });
            };

            const fightTurn = () => {
                const hpA = getHp(entA), hpB = getHp(entB);
                if (!entA || !entB || !hpA || !hpB || hpA.currentValue <= 0 || hpB.currentValue <= 0) return;

                const newLogs = [...logs];

                // Turn order by DEX
                const aFaster = entA.stats.dex && entB.stats.dex
                    ? entA.stats.dex.getCurrentValue() >= entB.stats.dex.getCurrentValue()
                    : true;

                if (aFaster) {
                    evaluateBehavior(entA, entB, newLogs);
                    if (hpB.currentValue > 0) evaluateBehavior(entB, entA, newLogs);
                } else {
                    evaluateBehavior(entB, entA, newLogs);
                    if (hpA.currentValue > 0) evaluateBehavior(entA, entB, newLogs);
                }

                if (hpA.currentValue <= 0) newLogs.push(`💀 ${getDisplayName(entA)} has been defeated!`);
                if (hpB.currentValue <= 0) newLogs.push(`💀 ${getDisplayName(entB)} has been defeated!`);

                setLogs(newLogs);
                setEntA(cloneEntity(entA));
                setEntB(cloneEntity(entB));
            };

            // ── Arena Grid ────────────────────────────────────────────────
            const ArenaGrid = ({ a, b }) => {
                const cells = [];
                for (let row = 0; row < ARENA_SIZE; row++) {
                    for (let col = 0; col < ARENA_SIZE; col++) {
                        const isWall = row === 0 || row === ARENA_SIZE - 1 || col === 0 || col === ARENA_SIZE - 1;
                        const isA = a && a.x === col && a.y === row;
                        const isB = b && b.x === col && b.y === row;

                        let cellContent = null;
                        let cellClass = 'flex items-center justify-center text-base font-bold select-none ';

                        if (isA && isB) {
                            cellContent = '⚔';
                            cellClass += 'bg-yellow-900/60 border-yellow-600 text-yellow-300';
                        } else if (isA) {
                            cellContent = 'A';
                            cellClass += 'bg-blue-900/70 border-blue-500 text-blue-300';
                        } else if (isB) {
                            cellContent = 'B';
                            cellClass += 'bg-red-900/70 border-red-500 text-red-300';
                        } else if (isWall) {
                            cellContent = '▪';
                            cellClass += 'bg-neutral-800 border-neutral-600 text-neutral-600';
                        } else {
                            cellClass += 'bg-neutral-950 border-neutral-800 text-transparent';
                            cellContent = '·';
                        }

                        cells.push(
                            <div
                                key={ `${row}-${col}` }
                                className={ `border ${cellClass}` }
                                style={ { aspectRatio: '1 / 1', fontSize: '0.7rem' } }
                                title={ `(${col}, ${row})` }
                            >
                                { cellContent }
                            </div>
                        );
                    }
                }

                return (
                    <div
                        style={ {
                            display: 'grid',
                            gridTemplateColumns: `repeat(${ARENA_SIZE}, 1fr)`,
                            gap: '1px',
                            width: '100%',
                            maxWidth: '360px'
                        } }
                    >
                        { cells }
                    </div>
                );
            };

            // ── HP bar helper ─────────────────────────────────────────────
            const HpBar = ({ entity, color }) => {
                const h = getHp(entity) || { currentValue: 0, maxValue: 1 };
                const pct = Math.max(0, Math.min(100, (h.currentValue / (h.maxValue || 1)) * 100));
                return (
                    <div className="w-full bg-gray-800 h-2 rounded-full overflow-hidden mt-0.5">
                        <div
                            className={ `h-full transition-all duration-300 ${color}` }
                            style={ { width: `${pct}%` } }
                        />
                    </div>
                );
            };

            const hpA = getHp(entA);
            const hpB = getHp(entB);
            const isCombatOver = entA && entB && hpA && hpB && (hpA.currentValue <= 0 || hpB.currentValue <= 0);

            // Keep fightTurnRef current so the interval closure always calls the latest version
            fightTurnRef.current = fightTurn;

            // Auto-play interval — max 10 turns/sec (100ms)
            useEffect(() => {
                if (!isAuto || isCombatOver) {
                    if (isCombatOver) setIsAuto(false);
                    return;
                }
                const id = setInterval(() => { fightTurnRef.current(); }, 100);
                return () => clearInterval(id);
            }, [isAuto, isCombatOver]);

            return (
                <div className="p-3 sm:p-4 h-full flex flex-col gap-3 overflow-hidden">

                    {/* Character Sheet Modal */ }
                    <EntitySheetModal entity={ modalEntity } onClose={ () => setModalEntity(null) } />

                    {/* ── Top Bar ── */ }
                    <div className="flex items-center gap-2 flex-wrap">
                        {/* Entity A Button */ }
                        <button
                            onClick={ () => entA && setModalEntity(entA) }
                            disabled={ !entA }
                            className={ `flex-1 min-w-[140px] text-left px-3 py-2 rounded-lg border transition-all ${entA ? 'bg-blue-950/60 border-blue-700 hover:bg-blue-900/60 cursor-pointer' : 'bg-neutral-900 border-neutral-800 opacity-40 cursor-default'
                                }` }
                        >
                            <div className="text-xs text-blue-400 font-bold uppercase tracking-wider mb-0.5">Entity A</div>
                            <div className="font-bold text-white text-sm truncate">{ entA ? getDisplayName(entA) : '—' }</div>
                            { entA && <>
                                <div className="text-xs text-gray-400 mt-0.5">{ hpA ? `${hpA.currentValue.toFixed(0)} / ${hpA.maxValue.toFixed(0)} HP` : '' }</div>
                                <HpBar entity={ entA } color="bg-blue-500" />
                            </> }
                        </button>

                        {/* VS + Controls */ }
                        <div className="flex flex-col items-center gap-1.5 shrink-0">
                            <div className="text-lg font-black text-neutral-500 tracking-widest">VS</div>
                            <button
                                onClick={ setup }
                                className="bg-yellow-700 hover:bg-yellow-600 text-white px-3 py-1 rounded font-bold text-xs flex items-center gap-1 transition"
                            >
                                <RotateCcw size={ 12 } /> New Fight
                            </button>
                            <button
                                onClick={ fightTurn }
                                disabled={ !entA || !entB || isCombatOver || isAuto }
                                className="bg-red-700 hover:bg-red-600 disabled:opacity-40 disabled:cursor-not-allowed text-white px-3 py-1 rounded font-bold text-xs flex items-center gap-1 transition"
                            >
                                <Swords size={ 12 } /> Next Turn
                            </button>
                            <button
                                onClick={ () => setIsAuto(a => !a) }
                                disabled={ !entA || !entB || isCombatOver }
                                className={ `px-3 py-1 rounded font-bold text-xs flex items-center gap-1 transition disabled:opacity-40 disabled:cursor-not-allowed border ${isAuto
                                    ? 'bg-green-700 hover:bg-green-600 border-green-500 text-white'
                                    : 'bg-neutral-800 hover:bg-neutral-700 border-neutral-600 text-gray-300'
                                    }` }
                            >
                                { isAuto ? '⏸ Pause' : '▶ Auto' }
                            </button>
                        </div>

                        {/* Entity B Button */ }
                        <button
                            onClick={ () => entB && setModalEntity(entB) }
                            disabled={ !entB }
                            className={ `flex-1 min-w-[140px] text-right px-3 py-2 rounded-lg border transition-all ${entB ? 'bg-red-950/60 border-red-700 hover:bg-red-900/60 cursor-pointer' : 'bg-neutral-900 border-neutral-800 opacity-40 cursor-default'
                                }` }
                        >
                            <div className="text-xs text-red-400 font-bold uppercase tracking-wider mb-0.5">Entity B</div>
                            <div className="font-bold text-white text-sm truncate">{ entB ? getDisplayName(entB) : '—' }</div>
                            { entB && <>
                                <div className="text-xs text-gray-400 mt-0.5">{ hpB ? `${hpB.currentValue.toFixed(0)} / ${hpB.maxValue.toFixed(0)} HP` : '' }</div>
                                <HpBar entity={ entB } color="bg-red-500" />
                            </> }
                        </button>
                    </div>

                    {/* ── Main Area: Grid + Log ── */ }
                    <div className="flex-1 flex flex-col sm:flex-row gap-3 overflow-hidden min-h-0">

                        {/* Arena Grid */ }
                        <div className="flex flex-col items-center gap-2 shrink-0">
                            <div className="text-xs text-neutral-500 font-mono uppercase tracking-widest">Arena (10×10 playable · 12×12 with walls)</div>
                            { entA || entB
                                ? <ArenaGrid a={ entA } b={ entB } />
                                : (
                                    <div
                                        className="flex items-center justify-center bg-neutral-950 border border-neutral-800 rounded text-neutral-700 text-sm italic"
                                        style={ { width: '360px', height: '360px' } }
                                    >
                                        Press "New Fight" to begin
                                    </div>
                                )
                            }
                            { entA && entB && (
                                <div className="flex gap-4 text-xs text-neutral-500 font-mono">
                                    <span className="text-blue-400">● A ({ entA.x },{ entA.y })</span>
                                    <span className="text-red-400">● B ({ entB.x },{ entB.y })</span>
                                </div>
                            ) }
                        </div>

                        {/* Combat Log */ }
                        <div className="flex-1 bg-black rounded-lg border border-neutral-800 overflow-y-auto scroll-custom font-mono text-xs p-3 min-h-0 flex flex-col">
                            <div className="text-neutral-600 text-xs uppercase tracking-widest mb-2 font-bold border-b border-neutral-900 pb-1">Combat Log</div>
                            { logs.length === 0
                                ? <div className="flex-1 flex flex-col items-center justify-center text-neutral-700 italic gap-2">
                                    <Swords size={ 28 } /> Ready
                                </div>
                                : logs.map((l, i) => {
                                    const cls = l.includes('defeated') ? 'text-red-400 font-bold border-red-600'
                                        : l.includes('↳ Hits') ? 'text-orange-300 border-orange-600'
                                            : l.includes('uses') ? 'text-cyan-300 border-cyan-700'
                                                : l.includes('moves') ? 'text-neutral-400 border-neutral-700'
                                                    : l.includes('battle') || l.includes('Battle') ? 'text-yellow-400 border-yellow-700'
                                                        : 'text-neutral-500 border-neutral-800';
                                    return (
                                        <div key={ i } className={ `mb-1 border-l-2 pl-2 leading-relaxed ${cls}` }>
                                            { l }
                                        </div>
                                    );
                                })
                            }
                            <div ref={ logEndRef } />
                        </div>
                    </div>
                </div>
            );
        }

        const App = () => {
            const [tab, setTab] = useState('gen');

            return (
                <div className="h-screen flex flex-col bg-neutral-950 text-gray-100 font-sans">
                    <div className="bg-neutral-900 border-b border-neutral-800 px-3 py-2 sm:p-4 flex justify-between items-center gap-2 shadow-md z-10">
                        <h1 className="text-base sm:text-2xl font-black tracking-widest text-white flex items-center gap-1 sm:gap-2 shrink-0">
                            <Zap size={ 16 } className="text-blue-500 fill-current" />
                            <span className="text-blue-500">MADCORE</span>
                            <span className="hidden sm:inline">// RPG</span>
                        </h1>
                        <div className="flex gap-0.5 sm:gap-2 bg-neutral-950 p-1 rounded-lg border border-neutral-800">
                            <button onClick={ () => setTab('gen') } className={ `px-2 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-bold transition flex items-center gap-1 sm:gap-2 ${tab === 'gen' ? 'bg-neutral-800 text-blue-400 shadow-sm border border-neutral-700' : 'text-gray-500 hover:text-gray-300'}` }>
                                <Dice5 size={ 14 } /><span className="hidden sm:inline">Generator</span>
                            </button>
                            <button onClick={ () => setTab('grid') } className={ `px-2 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-bold transition flex items-center gap-1 sm:gap-2 ${tab === 'grid' ? 'bg-neutral-800 text-green-400 shadow-sm border border-neutral-700' : 'text-gray-500 hover:text-gray-300'}` }>
                                <Filter size={ 14 } /><span className="hidden sm:inline">Data Matrix</span>
                            </button>
                            <button onClick={ () => setTab('bat') } className={ `px-2 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-bold transition flex items-center gap-1 sm:gap-2 ${tab === 'bat' ? 'bg-neutral-800 text-red-400 shadow-sm border border-neutral-700' : 'text-gray-500 hover:text-gray-300'}` }>
                                <Swords size={ 14 } /><span className="hidden sm:inline">Simulation</span>
                            </button>
                            <button onClick={ () => setTab('def') } className={ `px-2 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-bold transition flex items-center gap-1 sm:gap-2 ${tab === 'def' ? 'bg-neutral-800 text-amber-400 shadow-sm border border-neutral-700' : 'text-gray-500 hover:text-gray-300'}` }>
                                <Activity size={ 14 } /><span className="hidden sm:inline">Definitions</span>
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 overflow-hidden relative">
                        { tab === 'gen' && <GeneratorView /> }
                        { tab === 'grid' && <DataGridView /> }
                        { tab === 'bat' && <BattleView /> }
                        { tab === 'def' && <DefinitionsView /> }
                    </div>
                </div>
            );
        };

        // Root wrapper that shows a loading screen until all JSON data is ready.
        const RootLoader = () => {
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState(null);

            useEffect(() => {
                initGameData()
                    .then(() => setIsLoading(false))
                    .catch(err => {
                        console.error('[GameData Loader] Fatal error:', err);
                        setLoadError(err.message);
                        setIsLoading(false);
                    });
            }, []);

            if (isLoading) {
                return (
                    <div style={ {
                        display: 'flex', flexDirection: 'column', alignItems: 'center',
                        justifyContent: 'center', height: '100vh',
                        background: '#0a0a0a', color: '#e5e5e5', gap: '16px'
                    } }>
                        <div style={ { fontSize: '2rem', fontWeight: 'bold', letterSpacing: '0.15em', color: '#3b82f6' } }>⚡ MADCORE</div>
                        <div style={ { fontSize: '1rem', color: '#6b7280', animation: 'pulse 1.5s infinite' } }>Loading Data Engine...</div>
                        <style>{ `@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }` }</style>
                    </div>
                );
            }

            if (loadError) {
                return (
                    <div style={ {
                        display: 'flex', flexDirection: 'column', alignItems: 'center',
                        justifyContent: 'center', height: '100vh',
                        background: '#0a0a0a', color: '#ef4444', gap: '12px'
                    } }>
                        <div style={ { fontSize: '1.5rem', fontWeight: 'bold' } }>⚠ Data Load Failed</div>
                        <div style={ { fontSize: '0.875rem', color: '#9ca3af', maxWidth: '500px', textAlign: 'center' } }>{ loadError }</div>
                        <div style={ { fontSize: '0.75rem', color: '#6b7280' } }>Make sure the page is served via a local web server (e.g. python -m http.server 8080)</div>
                    </div>
                );
            }

            return <App />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RootLoader />);
    </script>
</body>

</html>
